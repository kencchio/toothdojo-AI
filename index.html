stem:"A healthcare company is developing an AI-driven system to assist doctors with medical diagnoses based on patient data. The system must comply with HIPAA regulations and follow responsible AI principles to prevent bias and ensure data privacy.\n\nWhich actions should the company take to align with responsible AI principles while developing the diagnostic system? (Select TWO.)",
choices:["Perform regular audits","Use historical medical records without preprocessing","Use third-party pre-trained models without modification","Exclude patients with rare conditions to improve model accuracy","Obfuscate sensitive patient information before model training"],answer:[0,4],
why:["Regular audits help detect bias, errors, and compliance gaps over time.","Raw historical records can carry bias and sensitive data; skipping preprocessing works against fairness and privacy.","Using an external model as-is skips validation for bias and suitability for this patient population.","Excluding a group makes the model unfair to those patients and reduces inclusivity.","Masking or de-identifying patient data protects privacy and supports HIPAA compliance."],
explain:"Regular audits support fairness and accountability; obfuscating sensitive data supports privacy."},

{id:"td4-11",src:"td",domain:4,type:"single",
stem:"An ML engineer is building large language models (LLMs) for a chatbot application. During development, the engineer wants to ensure that the LLMs don't exhibit any unintended bias.\n\nWhich option would be the most suitable for this use case?",
choices:["Use Amazon SageMaker Clarify to assess and mitigate bias","Use AWS AI Service Cards to visualize decision boundaries and identify potential bias","Analyze text data with Amazon Comprehend to identify potential bias","Fine-tune the model using additional labeled data to improve fairness"],answer:0,
why:["Clarify helps identify bias during training or inference, explains model reasoning, and can generate governance reports.","Service Cards are documentation about AWS AI services; they don't visualize decision boundaries or analyze your model.","Comprehend extracts insights from text but isn't a bias-assessment tool for models.","More data might help, but without measuring bias first you can't know whether fairness improved."],
explain:"Detecting and assessing bias in a model under development → SageMaker Clarify."},

{id:"td4-12",src:"td",domain:4,type:"single",
stem:"A content creator uses generative AI to produce marketing material that closely resembles existing text without proper attribution.\n\nWhat challenge of generative AI does this situation highlight?",
choices:["Intellectual Property","Hallucinations","Toxicity","Disruption of the nature of work"],answer:0,
why:["Reproducing existing content without attribution raises copyright and ownership concerns.","Hallucination is fabricating false content, not copying existing content.","Toxicity is offensive or harmful content.","Refers to AI changing jobs and workflows, not copying content."],
explain:"Output that closely resembles existing work without attribution → intellectual property challenge."},

{id:"td4-13",src:"td",domain:4,type:"single",
stem:"A finance company uses Amazon Bedrock to deploy a generative AI chatbot that provides personalized financial advice. As part of its governance framework outlined in the AWS Generative AI Security Scoping Matrix, the company needs a solution to control and evaluate the chatbot's generated content to ensure accuracy, appropriateness, and adherence to regulatory standards.\n\nWhich AWS tool will help ensure that the chatbot's advice meets accuracy and regulatory compliance standards?",
choices:["Guardrails for Bedrock","Amazon Comprehend","Amazon Lex","Bedrock Agents"],answer:0,
why:["Establishes boundaries around generated output so responses stay relevant, appropriate, and within the company's policies and regulations.","Extracts insights from text; it doesn't control what a Bedrock chatbot generates.","Builds conversational interfaces; it doesn't enforce content policies on FM output.","Orchestrates multi-step actions; it doesn't control output content."],
explain:"Controlling what a Bedrock app is allowed to say → Guardrails for Amazon Bedrock."},

{id:"td4-14",src:"td",domain:4,type:"multi",pick:2,
stem:"Which of the following can Amazon SageMaker Clarify perform? (Select TWO.)",
choices:["Generate synthetic data to improve model training","Perform automatic hyperparameter optimization to improve model accuracy","Perform data augmentation to increase the size of the training dataset","Identify bias in post-training data during or after model training","Detect bias in pre-training data"],answer:[3,4],
why:["Clarify doesn't generate synthetic data.","Hyperparameter optimization is SageMaker automatic model tuning, not Clarify.","Clarify doesn't augment datasets.","Clarify computes post-training bias metrics on a trained model's predictions.","Clarify computes pre-training bias metrics on the dataset before training."],
explain:"Clarify covers pre-training bias, post-training bias, and explainability — not data generation or tuning."},

{id:"td4-15",src:"td",domain:4,type:"single",
stem:"A team is working with a Large Language Model (LLM) to generate responses for customer support queries. It is observed that the model occasionally provides answers that are factually incorrect or nonsensical.\n\nWhat issue is the model experiencing?",
choices:["Data augmentation","Model drift","Underfitting","Hallucination"],answer:3,
why:["A technique for expanding training data, not a failure mode.","A decline in performance over time as data changes, not occasional fabricated answers.","A model too simple to capture patterns; not the term for fabricated answers from an LLM.","The model generates content not grounded in its training data or the provided context."],
explain:"Factually incorrect or nonsensical but confident answers → hallucination."},

// ---------- Tutorials Dojo: Domain 5 set ----------
{id:"td5-01",src:"td",domain:5,type:"single",
stem:"A healthcare organization is migrating its patient management system to AWS. It must ensure that all AWS services it plans to use comply with healthcare regulations such as HIPAA and HITRUST, and it must obtain security and compliance documentation from AWS to demonstrate compliance to auditors.\n\nWhich AWS service can this organization use to access the necessary security and compliance reports?",
choices:["AWS Security Hub","AWS CloudTrail","Amazon Macie","AWS Artifact"],answer:3,
why:["Aggregates security findings across your account; it doesn't provide AWS's own compliance reports.","Logs API activity in your account; it doesn't provide compliance reports.","Discovers sensitive data in S3; it doesn't provide compliance reports.","Provides on-demand access to AWS's security and compliance reports, such as SOC, PCI, and ISO certifications."],
explain:"'Get AWS's compliance reports/certifications' → AWS Artifact."},

{id:"td5-02",src:"td",domain:5,type:"multi",pick:2,
stem:"A company has deployed a machine learning model for fraud detection in its e-commerce platform. The model has been running in production for several months, and the company wants to ensure it continues to perform accurately and reliably.\n\nWhich AWS services or features should the company use to monitor the model's performance and incorporate human review when necessary? (Select TWO.)",
choices:["Amazon SageMaker Data Wrangler","Amazon SageMaker Ground Truth","Amazon A2I (Amazon Augmented AI)","Amazon SageMaker Model Monitor","Amazon Bedrock"],answer:[2,3],
why:["A data-preparation tool; it doesn't monitor deployed models.","Labels training data; it isn't for reviewing live predictions.","Builds human review workflows for ML predictions.","Monitors production models for data drift, concept drift, and other quality issues, with alerts.","Provides access to foundation models; it doesn't monitor this model or add human review."],
explain:"Monitor production performance → Model Monitor. Human review of predictions → Amazon A2I."},

{id:"td5-03",src:"td",domain:5,type:"single",
stem:"A research institution has deployed a generative AI solution. The compliance team must guarantee the solution protects the confidentiality, integrity, and availability of the data it accesses, as the institution handles sensitive federal research data.\n\nWhich standards will ensure the solution meets US government regulatory requirements?",
choices:["Health Insurance Portability and Accountability Act (HIPAA)","Payment card industry data security standard (PCI-DSS)","National Institute of Standards and Technology (NIST)","Federal Risk and Authorization Management Program (FedRAMP)"],answer:2,
why:["Applies to protected health information, not federal research data in general.","Applies to payment card data.","Develops standards for US federal information systems focused on confidentiality, integrity, and availability, and publishes the NIST AI Risk Management Framework.","Authorizes cloud service offerings for use by federal agencies; it isn't the standard for the solution's own data-protection controls described here."],
explain:"Confidentiality, integrity, and availability for US federal information → NIST standards (including the NIST AI RMF)."},

{id:"td5-04",src:"td",domain:5,type:"multi",pick:2,
stem:"A data science team is working on a computer vision project that involves training a deep learning model on a large dataset of labeled images.\n\nWhich of the following best practices should the team follow to ensure the security and integrity of its training data? (Select TWO.)",
choices:["Conduct exploratory data analysis to identify and remove outliers and anomalies","Implement role-based access controls to restrict data access to authorized personnel only","Perform data normalization to standardize the image formats and dimensions","Leverage versioning and audit trails to track changes to the dataset","Use cryptographic hashing techniques to verify the authenticity of the data"],answer:[1,4],
why:["Improves data quality, but isn't a security or integrity control.","Restricts who can access or change the data — a security control.","A preprocessing step for model quality, not security.","Useful for tracking changes, but Tutorials Dojo's answer key favors access control and hashing as the security-and-integrity controls here.","Hashes let you verify the data hasn't been altered — an integrity control."],
explain:"Security → restrict access (RBAC). Integrity → verify data hasn't been tampered with (cryptographic hashing)."},

{id:"td5-05",src:"td",domain:5,type:"multi",pick:3,
stem:"A technology firm is implementing a new generative AI model for customer interactions. The ML security team must identify the most critical security vulnerabilities that could impact the AI model's performance and integrity.\n\nWhich vulnerabilities should the firm prioritize? (Select THREE.)",
choices:["Model theft","Excessive agency","Overreliance on AI capabilities","Prompt injection","Model denial of service","Training data poisoning"],answer:[3,4,5],
why:["A real risk, but it's about stealing the model rather than degrading its performance and integrity.","Concerns an AI system taking too many autonomous actions; not the priority named here.","A human usage risk rather than a vulnerability in the model itself.","Crafted inputs override the model's instructions and manipulate outputs.","Resource-heavy requests degrade the model's availability and performance.","Malicious data inserted into training data corrupts the model's behavior."],
explain:"Threats that directly hit a model's performance and integrity: prompt injection, model denial of service, and training data poisoning."},

{id:"td5-06",src:"td",domain:5,type:"single",
stem:"A cloud security engineer must ensure that only specific applications and services can access Amazon SageMaker and Amazon RDS resources, with controlled and limited access to minimize the risk of unauthorized access.\n\nWhich AWS solution can the engineer use to grant and manage these permissions effectively?",
choices:["AWS Identity and Access Management (IAM)","Amazon S3 managed keys (SSE-S3)","AWS Security Token Service (STS)","AWS Secrets Manager"],answer:0,
why:["Defines roles and policies that allow or deny access to specific AWS services and resources — fine-grained access control.","An S3 encryption option; it doesn't manage permissions to SageMaker or RDS.","Issues temporary credentials, but permissions themselves are defined and managed in IAM.","Stores and rotates secrets like database passwords; it doesn't define who can access which services."],
explain:"Granting and managing permissions to AWS resources → IAM."},

{id:"td5-07",src:"td",domain:5,type:"single",
stem:"A company stores sensitive data in Amazon S3 buckets and needs a solution that automatically discovers, classifies, and protects this sensitive data. The company is concerned about model theft from exposed training data.\n\nWhich of the following is the MOST suitable for this use case?",
choices:["Amazon Macie","AWS Config","Amazon Inspector","Amazon Kinesis"],answer:0,
why:["Uses ML to automatically discover and classify sensitive data such as PII in S3.","Tracks resource configurations and compliance; it doesn't classify data content.","Scans workloads for software vulnerabilities; it doesn't discover sensitive data.","A streaming data service; unrelated to sensitive data discovery."],
explain:"'Discover and classify sensitive data in S3' → Amazon Macie."},

{id:"td5-08",src:"td",domain:5,type:"single",
stem:"An AI startup develops and deploys generative AI models using Amazon SageMaker, Amazon Bedrock, and Amazon Q Business. Following the AWS Generative AI Security Scoping Matrix, the team wants to audit AWS service API activity related to generative AI workloads due to concerns about unauthorized access to sensitive training data and model parameters.\n\nWhich service can help the startup audit AWS service API activity?",
choices:["AWS CloudTrail","AWS Config","Amazon EKS","AWS Trusted Advisor"],answer:0,
why:["Records actions taken by users, roles, and services as events, enabling audit of API activity.","Records resource configuration changes, not a full audit of API calls.","A Kubernetes service; unrelated to auditing API activity.","Gives best-practice recommendations; it doesn't audit API activity."],
explain:"'Audit who called which API, and when' → AWS CloudTrail."},

{id:"td5-09",src:"td",domain:5,type:"single",
stem:"An AI specialist trains models to optimize a company's network operations, using metrics such as Mean Squared Error and RMSE. To comply with industry standards, the specialist must document the models' training and performance details for auditing purposes.\n\nWhat AWS solution can help the company fulfill this need?",
choices:["AWS CloudTrail","AWS Config","Amazon SageMaker Model Monitor","Amazon SageMaker Model Cards"],answer:3,
why:["Logs API activity; it doesn't document model training and performance details.","Tracks resource configurations; it doesn't document models.","Monitors deployed models for drift; it isn't documentation.","Documents a model's training data, performance metrics, and intended use in a standardized format for audits."],
explain:"'Document the model for auditing' → SageMaker Model Cards."},

{id:"td5-10",src:"td",domain:5,type:"single",
stem:"A financial institution must ensure that data transferred from Amazon S3 to an Amazon SageMaker instance for training does not leave the AWS network. The institution requires a dedicated S3 endpoint to route all training data traffic privately within the AWS network.\n\nWhich AWS solution will meet this requirement most effectively?",
choices:["S3 Access Point","S3 Transfer Acceleration","Amazon VPC Gateway Endpoint","Amazon CloudFront Distribution"],answer:2,
why:["Simplifies access management for shared datasets; it doesn't by itself keep traffic off the internet.","Speeds up long-distance transfers over the internet; it doesn't keep traffic private.","Privately connects a VPC to S3 without an internet gateway, NAT device, or VPN.","A content delivery network; it doesn't route training traffic privately to S3."],
explain:"Private VPC-to-S3 traffic → VPC gateway endpoint."},

{id:"td5-11",src:"td",domain:5,type:"single",
stem:"A biotech company uses ML models on AWS to analyze sensitive genomic data and must comply with local algorithm accountability laws. The audit team must obtain on-demand access to AWS's official security and compliance documentation to verify AWS's adherence to industry standards.\n\nWhich AWS service can provide this information?",
choices:["AWS Trusted Advisor","AWS Config","Amazon Inspector","AWS Artifact"],answer:3,

let store={answers:{},src:"all",domain:"all",missedOnly:false,shuffle:false,shuffleQ:false,qOrder:null,current:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)store=Object.assign(store,s);}catch(e){}

function paras(s){return s.split(/\n\n+/).map(p=>"<p>"+esc(p)+"</p>").join("");}
function shuffled(n,seed){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function displayOrder(q,n){
  if(!store.shuffle) return [...Array(n).keys()];
  if(!orderCache[q.id]) orderCache[q.id]=shuffled(n);
  return orderCache[q.id];
}
function shuffledIds(){
  const ids=ALL.map(q=>q.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return ids;
}
function baseList(){
  if(store.shuffleQ&&Array.isArray(store.qOrder)&&store.qOrder.length===ALL.length){
    return store.qOrder.map(id=>BY_ID[id]).filter(Boolean);
  }
  return ALL;
}

function filtered(){

    &&(store.domain==="all"||String(q.domain)===store.domain)

  if(q.type==="multi"){const a=[...q.answer].sort().join(),r=[...resp].sort().join();return {correct:a===r,got:resp.filter(x=>q.answer.includes(x)).length,total:q.answer.length};}
  if(q.type==="match"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
  if(q.type==="order"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
}

  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  let a=0,ok=0;pool.forEach(q=>{const r=store.answers[q.id];if(r){a++;if(r.correct)ok++;}});
  sAns.textContent=a;sOk.textContent=ok;sMiss.textContent=a-ok;sAcc.textContent=a?Math.round(ok/a*100)+"%":"–";
  subline.textContent=pool.length+" review questions with explanations for every choice.";
}

function renderControls(){
  document.querySelectorAll("#srcSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.src===store.src));
  cAll.textContent=ALL.length;cTd.textContent=TD_QUESTIONS.length;cAi.textContent=AI_QUESTIONS.length;
  const srcPool=ALL.filter(q=>store.src==="all"||q.src===store.src);
  const doms=[...new Set(srcPool.map(q=>q.domain))].sort();
  if(store.domain!=="all"&&!doms.includes(+store.domain)) store.domain="all";
  domainSel.innerHTML='<option value="all">All domains ('+srcPool.length+')</option>'+doms.map(d=>'<option value="'+d+'">Domain '+d+': '+DOMAINS[d]+' ('+srcPool.filter(q=>q.domain===d).length+')</option>').join("");
  domainSel.value=store.domain;
  missedOnly.checked=store.missedOnly;shuffle.checked=store.shuffle;shuffleQ.checked=store.shuffleQ;
  reshuffleBtn.style.visibility=store.shuffleQ?"visible":"hidden";
}

function renderGrid(list){
  if(!list.length){grid.innerHTML='<p class="empty-grid">No questions match these filters.</p>';gridNote.textContent="";return;}
  grid.innerHTML=list.map((q,i)=>{const r=store.answers[q.id];const cls=[r?(r.correct?"ok":"miss"):"",q.id===store.current?"cur":"",q.src==="ai"&&store.src==="all"?"ai":""].join(" ");
    return '<button class="'+cls+'" data-id="'+q.id+'" aria-label="Question '+(i+1)+(r?(r.correct?", correct":", missed"):", unanswered")+(q.src==="ai"?", AI-generated":", Tutorials Dojo")+'">'+(i+1)+'</button>';}).join("");
  gridNote.textContent=store.src==="all"?"Amber dot marks AI-generated questions.":"";
}

function instruction(q){
  if(q.type==="single") return "Choose one answer.";
  if(q.type==="multi") return "Choose "+q.pick+" answers.";
  if(q.type==="match") return "Pick a match for each item from the dropdowns.";
  return "Choose an item for each step, in order.";
}
function typeLabel(q){
  return {single:"Single choice",multi:"Multiple choice",match:"Matching",order:"Ordering"}[q.type];
}

function renderCard(){
  const list=filtered();
  renderStats();renderGrid(list);
  if(!list.length){
    card.innerHTML='<div class="emptystate"><h2>Nothing to show</h2><p>'+(store.missedOnly?"You have no missed questions under these filters. Turn off “Show missed only” to see everything.":"No questions match the current source and domain. Try a different combination.")+'</p></div>';return;
  }
  let idx=list.findIndex(q=>q.id===store.current);
  if(idx<0){idx=0;store.current=list[0].id;save();renderGrid(list);}
  const q=list[idx];const done=store.answers[q.id];
  const resp=done?done.resp:(draft[q.id]!==undefined?draft[q.id]:(q.type==="single"?null:q.type==="multi"?[]:q.type==="match"?q.prompts.map(()=>-1):Array(q.steps).fill(-1)));
  draft[q.id]=resp;

  const posPct=list.length>1?Math.round((idx/(list.length-1))*100):100;
  let h='<div class="qtrack"><div class="qtrack-fill" style="width:'+posPct+'%"></div></div>';
  h+='<div class="meta"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span><span class="tag">Domain '+q.domain+': '+DOMAINS[q.domain]+'</span><span class="tag">'+typeLabel(q)+'</span><span class="tag '+(q.src==="ai"?"src-ai":"")+'">'+(q.src==="ai"?"AI-generated":"Tutorials Dojo")+'</span></div>';
  h+='<div class="stem">'+paras(q.stem)+'</div><p class="instr">'+instruction(q)+'</p>';

  if(q.type==="single"||q.type==="multi"){
    const ord=displayOrder(q,q.choices.length);
    h+='<ul class="choices">'+ord.map((ci,pos)=>{
      const sel=q.type==="single"?resp===ci:resp.includes(ci);
      const isAns=q.type==="single"?q.answer===ci:q.answer.includes(ci);
      let cls="choice "+(q.type==="single"?"radio":"check");
      if(done){if(isAns)cls+=" right";else if(sel)cls+=" wrong";}else if(sel)cls+=" sel";
      const lab=done?(isAns?"Correct answer":(sel?"Your answer — incorrect":"Incorrect")):"";
      return '<li><button class="'+cls+'" data-ci="'+ci+'" '+(done?"disabled":"")+' role="'+(q.type==="single"?"radio":"checkbox")+'" aria-checked="'+sel+'"><span class="mark">'+(done?(isAns?"✓":(sel?"✕":LETTERS[pos])):LETTERS[pos])+'</span><span class="body">'+esc(q.choices[ci])+(done?'<span class="why"><b>'+lab+'.</b> '+esc(q.why[ci])+'</span>':'')+'</span></button></li>';
    }).join("")+'</ul>';
  }
  if(q.type==="match"){
    const ord=displayOrder(q,q.options.length);
    h+=q.prompts.map((p,pi)=>{
      let cls="matchrow";if(done)cls+=resp[pi]===q.answer[pi]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="m'+pi+'">'+esc(p)+'</label><select id="m'+pi+'" data-pi="'+pi+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(oi=>'<option value="'+oi+'" '+(resp[pi]===oi?"selected":"")+'>'+esc(q.options[oi])+'</option>').join("")+'</select>'+(done&&resp[pi]!==q.answer[pi]?'<div class="fix">Correct match: '+esc(q.options[q.answer[pi]])+'</div>':'')+'</div>';
    }).join("");
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.options.map((o,oi)=>'<li><b>'+esc(o)+(q.answer.includes(oi)?"":" (not used)")+'</b><span class="why">'+esc(q.why[oi])+'</span></li>').join("")+'</ul></div>';
  }
  if(q.type==="order"){
    const ord=displayOrder(q,q.items.length);
    h+='<div class="pool" style="border:0;margin:0;padding:0"><h3>Available steps</h3><ul>'+ord.map(ii=>'<li>'+esc(q.items[ii])+'</li>').join("")+'</ul></div><div style="margin-top:16px">';
    h+=resp.map((r,si)=>{
      let cls="matchrow step";if(done)cls+=r===q.answer[si]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="o'+si+'"><b>Step '+(si+1)+'</b></label><select id="o'+si+'" data-si="'+si+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(ii=>'<option value="'+ii+'" '+(r===ii?"selected":"")+'>'+esc(q.items[ii])+'</option>').join("")+'</select>'+(done&&r!==q.answer[si]?'<div class="fix">Correct step: '+esc(q.items[q.answer[si]])+'</div>':'')+'</div>';
    }).join("")+'</div>';
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.items.map((it,ii)=>'<li><b>'+esc(it)+'</b><span class="why">'+esc(q.why[ii])+'</span></li>').join("")+'</ul></div>';
  }

  if(done){
    const g=grade(q,done.resp);
    h+='<div class="feedback '+(done.correct?"ok":"miss")+'"><h3>'+(done.correct?"Correct":"Incorrect")+(g.total>1?" · "+g.got+" / "+g.total+" points":"")+'</h3><p>'+esc(q.explain)+'</p></div>';
  }

  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  h+='<div class="nav"><button class="btn" id="prevBtn" '+(idx===0?"disabled":"")+'>Previous</button><span class="spacer"></span>';
  if(done) h+='<button class="btn" id="retryBtn">Try again</button>';
  else h+='<button class="btn primary" id="checkBtn" '+(ready?"":"disabled")+'>Check answer</button>';
  h+='<button class="btn '+(done?"primary":"")+'" id="nextBtn" '+(idx===list.length-1?"disabled":"")+'>Next</button></div>';
  h+='<p class="kbd"><kbd>←</kbd> <kbd>→</kbd> move between questions · <kbd>A</kbd>–<kbd>E</kbd> pick a choice · <kbd>Enter</kbd> check answer</p>';
  card.classList.remove("fade-in");
  card.innerHTML=h;
  void card.offsetWidth;
  card.classList.add("fade-in");

  // events
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ci;
    if(q.type==="single") draft[q.id]=ci;
    else{const s=draft[q.id];const k=s.indexOf(ci);if(k>=0)s.splice(k,1);else if(s.length<q.pick)s.push(ci);else{s.shift();s.push(ci);}}
    renderCard();
  });
  card.querySelectorAll("select[data-pi]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.pi]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  card.querySelectorAll("select[data-si]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.si]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  const cb=document.getElementById("checkBtn");if(cb)cb.onclick=()=>check(q);
  const rb=document.getElementById("retryBtn");if(rb)rb.onclick=()=>{delete store.answers[q.id];delete draft[q.id];delete orderCache[q.id];save();renderCard();};
  document.getElementById("prevBtn").onclick=()=>go(-1);
  document.getElementById("nextBtn").onclick=()=>go(1);
}

function check(q){
  const resp=draft[q.id];
  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  if(!ready)return;
  const g=grade(q,resp);
  store.answers[q.id]={resp:JSON.parse(JSON.stringify(resp)),correct:g.correct};save();renderCard();
}
function go(d){
  const list=filtered();const i=list.findIndex(q=>q.id===store.current);const n=i+d;
  if(n<0||n>=list.length)return;store.current=list[n].id;save();renderCard();window.scrollTo({top:0});
}

// controls
document.querySelectorAll("#srcSeg button").forEach(b=>b.onclick=()=>{store.src=b.dataset.src;save();renderControls();renderCard();});
domainSel.onchange=()=>{store.domain=domainSel.value;save();renderCard();};
missedOnly.onchange=()=>{store.missedOnly=missedOnly.checked;save();renderCard();};
shuffle.onchange=()=>{store.shuffle=shuffle.checked;for(const k in orderCache)delete orderCache[k];save();renderCard();};
shuffleQ.onchange=()=>{store.shuffleQ=shuffleQ.checked;if(store.shuffleQ)store.qOrder=shuffledIds();save();renderControls();renderCard();};
reshuffleBtn.onclick=()=>{store.qOrder=shuffledIds();save();renderCard();};
grid.onclick=e=>{const b=e.target.closest("button[data-id]");if(!b)return;store.current=b.dataset.id;save();renderCard();if(window.innerWidth<=900){ctrl.open=false;card.scrollIntoView({behavior:"smooth"});}};
resetBtn.onclick=()=>{if(!confirm("Clear all answers and start over?"))return;store.answers={};for(const k in draft)delete draft[k];save();renderCard();};

resultsBtn.onclick=()=>{
  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  const ans=pool.filter(q=>store.answers[q.id]);const ok=ans.filter(q=>store.answers[q.id].correct);
  const row=(label,qs)=>{const a=qs.filter(q=>store.answers[q.id]);const o=a.filter(q=>store.answers[q.id].correct);const pct=a.length?Math.round(o.length/a.length*100):0;
    return '<div class="bar"><span>'+esc(label)+'</span><span class="n">'+o.length+' / '+a.length+'</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';};
  const doms=[...new Set(pool.map(q=>q.domain))].sort();
  const missed=pool.filter(q=>store.answers[q.id]&&!store.answers[q.id].correct);
  const pct=ans.length?Math.round(ok.length/ans.length*100):0;
  let h='<h2>Your results</h2><p style="margin:0;color:var(--muted)">'+ans.length+' of '+pool.length+' questions answered</p>';
  h+='<div class="scorepanel"><div class="ring" style="background:conic-gradient(var(--amber) '+(pct*3.6)+'deg, var(--line) 0deg)"><div class="ring-inner"><b>'+(ans.length?pct+"%":"–")+'</b><span>accuracy</span></div></div>';
  h+='<p>'+ok.length+' correct, '+(ans.length-ok.length)+' missed. AWS scales scores to 100–1,000 and requires 700 to pass, so aim for 80% or more here.</p></div>';
  h+='<h3 style="margin:22px 0 0;font-size:1rem">By domain</h3><div class="bars">'+doms.map(d=>row("Domain "+d+": "+DOMAINS[d],pool.filter(q=>q.domain===d))).join("")+'</div>';
  if(store.src==="all") h+='<h3 style="margin:10px 0 0;font-size:1rem">By source</h3><div class="bars">'+row("Tutorials Dojo",pool.filter(q=>q.src==="td"))+row("AI-generated",pool.filter(q=>q.src==="ai"))+'</div>';
  if(missed.length) h+='<h3 style="margin:10px 0 0;font-size:1rem">Missed questions</h3><div class="missed-list">'+missed.map(q=>'<button data-id="'+q.id+'">'+esc(q.stem.split("\n\n").slice(-1)[0].slice(0,110))+'…</button>').join("")+'</div>';
  h+='<div class="row">'+(missed.length?'<button class="btn" id="reviewMissed">Review missed only</button>':'')+'<button class="btn primary" id="closeRes">Close</button></div>';
  resultsBody.innerHTML=h;results.showModal();
  closeRes.onclick=()=>results.close();
  const rm=document.getElementById("reviewMissed");if(rm)rm.onclick=()=>{store.missedOnly=true;store.current=missed[0].id;save();renderControls();renderCard();results.close();};
  resultsBody.querySelectorAll(".missed-list button").forEach(b=>b.onclick=()=>{store.current=b.dataset.id;save();results.close();renderCard();});
};

document.addEventListener("keydown",e=>{
  if(results.open||e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="Enter"&&!e.target.closest("button")){const cb=document.getElementById("checkBtn");if(cb&&!cb.disabled)cb.click();}
  else{const i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0&&i<8){const btns=card.querySelectorAll(".choice:not(:disabled)");if(btns[i])btns[i].click();}}
});

if(window.innerWidth<=900)ctrl.open=false;
renderControls();renderCard();
})();
</script>
</body>
</html>
