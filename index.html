why:["Raising the threshold makes the model flag spam only when very confident, reducing false positives (legitimate emails wrongly flagged) — increasing precision — while some real spam scoring between 0.5 and 0.8 now slips through, lowering recall. This directly addresses the complaint.","Raising the threshold makes the model MORE conservative about flagging spam, which increases precision and decreases recall — the reverse of what this option claims.","Precision and recall generally move in opposite directions when only the threshold changes; a single threshold shift doesn't improve both simultaneously.","Changing the threshold changes which predictions are classified positive vs. negative, which directly changes the false positive and false negative counts — and therefore precision and recall, not just accuracy."],
explain:"Raising a classification threshold trades recall for precision: fewer false positives (good for this complaint) but more false negatives (missed spam)."},

{id:"ai1-07",src:"ai",domain:1,type:"single",
stem:"A real estate company trains two models to predict home sale prices. Model A has an RMSE of $28,000 and an MAE of $19,000. Model B has an RMSE of $22,000 and the same MAE of $19,000. Both are evaluated on the same test set, which includes a few ultra-luxury homes priced far above the rest.\n\nWhat does the difference between the two models' RMSE values most likely indicate, given that their MAE is identical?",
choices:["Model A is likely making a few much larger errors than Model B, probably on the high-value outlier homes, since RMSE penalizes large errors more heavily than MAE does","Model A is the better model overall, since RMSE is always the more important metric","The two models have identical typical error sizes, so the RMSE values must be a calculation mistake","Model B has higher bias than Model A, since a lower RMSE always indicates underfitting"],answer:0,
why:["RMSE squares errors before averaging, so it reacts strongly to a few large errors. Since both models share the same MAE (typical error size) but Model A has a much higher RMSE, Model A is likely making a few much larger errors — probably on those high-value outlier homes — that Model B avoids.","Neither metric is universally 'more important' — which one matters more depends on whether large, occasional errors are especially costly for the use case.","Two models can have the same average absolute error while differing in how evenly those errors are distributed — one can have a few very large errors while the other's errors are more uniform, which is exactly why RMSE can differ even when MAE matches.","RMSE reflects the size and distribution of errors, not underfitting versus overfitting directly, and a lower RMSE doesn't by itself indicate higher bias."],
explain:"RMSE penalizes large errors more than MAE does, because it squares them. When RMSE and MAE tell different stories, it's usually because of a few large errors — often on outliers — that RMSE reacts to but a plain average of absolute errors does not."},

{id:"ai1-08",src:"ai",domain:1,type:"match",
stem:"Match each dataset to its data type. Each data type may be used once or not at all. Read carefully — one item is a common source of confusion. (Select FOUR.)",
prompts:["A single spreadsheet snapshot of current warehouse inventory counts, taken once","GPS coordinates and speed logged every 5 seconds throughout a delivery truck's route","Chest X-ray scans from a hospital archive","Chat transcripts from customer support conversations"],
options:["Tabular (structured) data","Time-series data","Image data","Text data","Audio data"],answer:[0,1,2,3],
why:["A one-time snapshot with rows and columns fits a database table — it's tabular. It would only become time-series if it were repeated at intervals and the sequence of values over time mattered.","Recorded at regular time intervals where the sequence and timing carry meaning — the defining trait of time-series data, even though each individual reading is itself structured.","Unstructured pixel data, typically handled with deep learning (computer vision), not a database table.","Unstructured natural language, handled with NLP techniques.","Sound recordings. None of the four datasets described here are audio."],
explain:"The trap is the inventory snapshot: having rows and columns doesn't automatically make something time-series — it needs to be a sequence of observations over time. A single snapshot is just tabular data; only repeated, time-stamped readings (like the GPS log) are time-series."},

{id:"ai1-09",src:"ai",domain:1,type:"single",
stem:"A telecom company scores all 12 million customers for churn risk once every night in a single job that reads a full customer file from S3 and writes predictions back to S3. No one is waiting on any individual prediction, and the job must finish before business hours.\n\nWhich SageMaker inference option is BEST, and why is it better than the alternative most likely to be considered?",
choices:["Batch transform, because it processes the entire known dataset in one offline job with no persistent endpoint to pay for between runs","Asynchronous inference, because it can handle large payloads and scales to zero when idle","Real-time inference, because 12 million predictions require the lowest possible latency per request","Serverless inference, because traffic only occurs once a day, which matches its scale-to-zero design"],answer:0,
why:["The entire dataset is already known upfront and needs to be processed as one bulk offline job — exactly what batch transform is built for, with nothing to pay for between nightly runs.","Asynchronous inference is designed for individual requests that arrive one at a time and need to be queued — not for processing one big, already-known dataset as a single bulk job.","Nothing in the scenario requires per-prediction low latency — no one is waiting on an individual result, only on the whole job finishing before business hours.","Serverless inference still serves individual on-demand requests with cold-start latency; it isn't designed to process an entire 12-million-row dataset as one job the way batch transform is."],
explain:"The deciding factor is whether the data is a single, already-known bulk dataset (batch transform) or a stream of individual requests arriving over time, even if infrequently (asynchronous inference)."},

{id:"ai1-10",src:"ai",domain:1,type:"single",
stem:"An online retailer's fraud check runs on every checkout, all day, with roughly constant traffic of several hundred requests per second. Each check must return in well under 100ms. A colleague suggests serverless inference to save cost during the retailer's slower overnight hours.\n\nWhy is serverless inference NOT the right fit here, even though traffic does drop overnight?",
choices:["Serverless inference has cold-start latency when scaling up from zero, which risks violating the sub-100ms requirement whenever traffic resumes","Serverless inference cannot be used for fraud-detection models under any circumstances","Serverless inference is more expensive than a real-time endpoint at every traffic level","Serverless inference does not support classification models"],answer:0,
why:["Serverless inference scales down when idle and incurs a cold start when a new instance has to spin up. For a workload with strict, consistent sub-100ms latency and hundreds of requests per second most of the day, that cold-start risk makes it a worse fit than an always-on real-time endpoint.","Serverless inference has no such categorical restriction — the issue here is the latency and traffic profile, not the type of model.","Cost comparisons depend on traffic patterns; serverless is often cheaper for low, sporadic traffic, but that's not why it's a poor fit here — the issue is latency consistency, not cost.","Serverless inference supports the same models a real-time endpoint would; the limitation relevant here is architectural (cold starts), not model type."],
explain:"Serverless inference trades some latency consistency for cost savings during idle periods. High, steady traffic that must stay under a strict latency bound is the classic case for a persistent real-time endpoint instead."},

{id:"ai1-11",src:"ai",domain:1,type:"single",
stem:"A media company's model analyzes uploaded video files. Files can be up to 800MB, and processing takes between 5 and 45 minutes depending on video length. Users are notified by email when results are ready, so nothing is waiting live on the response, and the company wants the endpoint to scale down to zero instances when no uploads are in progress.\n\nWhich SageMaker inference option satisfies ALL of these requirements?",
choices:["Serverless inference, since it scales to zero and is designed for intermittent traffic","Real-time inference with a larger instance type to handle the payload","Asynchronous inference, since it supports payloads up to about 1GB, processing times up to about an hour, and can scale to zero when idle","Batch transform, since it can process large files without a persistent endpoint"],answer:2,
why:["Serverless inference caps payloads at roughly 4MB and request timeouts at roughly 60 seconds — far too small for an 800MB file that can take up to 45 minutes to process.","A larger instance type doesn't remove SageMaker's real-time payload limit (roughly 6MB) or make a 45-minute request practical over a synchronous connection, and it can't scale to zero while idle.","Asynchronous inference is built for exactly this combination: large payloads (up to about 1GB), long processing times (up to about an hour), and scaling to zero when idle, with results delivered once processing completes.","Batch transform processes a known, already-available dataset as one offline job; it isn't designed to accept files as they're uploaded one at a time by different users throughout the day."],
explain:"When a question gives specific payload size and processing-time numbers, check them against each option's actual limits: real-time (~6MB), serverless (~4MB payload, ~60s timeout), asynchronous (~1GB payload, up to about an hour) — asynchronous is the only one built for a large, slow, per-upload workload that still needs to scale to zero."},

{id:"ai1-12",src:"ai",domain:1,type:"order",steps:6,
stem:"Select and order the phases of the machine learning development lifecycle. Two of the items below are NOT lifecycle phases — leave them out. (Select and order SIX.)",
items:["Deploy the model","Collect, clean, and prepare the data","Monitor the model in production","Define the business goal and frame the ML problem","Evaluate the model against held-out data","Purchase Provisioned Throughput","Train and tune the model","Publish the model to the AWS Marketplace"],
answer:[3,1,6,4,0,2],
why:["Step 5. Put the approved model into a hosting environment (real-time, batch, edge) for use.","Step 2. Gather, clean, label, and transform the data before training.","Step 6. Watch the deployed model for drift and quality issues, feeding back into retraining.","Step 1. Frame the problem and success metric before touching any data.","Step 4. Validate performance on data the model hasn't seen, before deploying.","A Bedrock capacity/pricing decision, not a stage of the general ML development lifecycle.","Step 3. Fit the model to the prepared data and tune its hyperparameters.","A business distribution decision some organizations make with a finished model — not a stage of the core ML development lifecycle."],
explain:"Frame → Prepare data → Train → Evaluate → Deploy → Monitor is the loop. Provisioned Throughput and marketplace publishing are real AWS/business actions, but neither is a lifecycle stage itself."},

{id:"ai1-13",src:"ai",domain:1,type:"single",
stem:"A manufacturing company has 200,000 unlabeled photos of circuit boards and needs bounding-box labels around defects. A junior engineer proposes posting the raw labeling task directly to Amazon Mechanical Turk workers, with no additional tooling, to save time.\n\nWhy would Amazon SageMaker Ground Truth be a better choice than using Mechanical Turk directly?",
choices:["Ground Truth provides a managed labeling workflow with built-in quality tooling and active learning that can auto-label high-confidence images, reducing human effort and improving consistency","Ground Truth is required because Mechanical Turk cannot be used for image-labeling tasks at all","Ground Truth is cheaper in every case because it doesn't use human workers","Ground Truth eliminates the need for any human review of the labeled data"],answer:0,
why:["Ground Truth can use Mechanical Turk as one of its workforce options, but wraps it with a managed workflow: task templates, quality tooling, and active learning that automatically labels easier images once the model is confident, sending only harder cases to humans — reducing cost and improving consistency versus raw Mechanical Turk.","Mechanical Turk can technically be used for image-labeling tasks directly; the issue is a lack of managed tooling and quality control, not a hard restriction.","Ground Truth still uses human labelers (including, optionally, Mechanical Turk workers) — its savings come from reducing how much human labeling is needed via active learning, not from removing human labor entirely.","Ground Truth still involves human review, especially for lower-confidence predictions and quality checks — it doesn't eliminate human involvement, it makes it more targeted."],
explain:"Ground Truth isn't a replacement for a human workforce — it's a managed layer (workflow, quality tooling, active learning) on top of workforces like Mechanical Turk or a private team, which is why it beats going to raw Mechanical Turk directly."},

{id:"ai1-14",src:"ai",domain:1,type:"single",
stem:"A lender already has a trained document-extraction pipeline in production using Amazon Textract. When extraction confidence for a specific field falls below 90% on a live loan application, the company wants that field routed to a human for review before the application proceeds — without building a labeling job or retraining anything.\n\nWhich AWS capability fits, and how does it differ from re-running a SageMaker Ground Truth labeling job on the low-confidence cases?",
choices:["Amazon Augmented AI (A2I): it routes individual live predictions to human reviewers at inference time based on a confidence condition, without creating a training dataset","SageMaker Ground Truth: it can also route low-confidence live predictions to humans in real time during inference","Amazon Comprehend: it automatically escalates any low-confidence NLP result to a human reviewer","SageMaker Model Monitor: it flags low-confidence predictions and pauses the endpoint until a human approves them"],answer:0,
why:["A2I is built specifically for human review of individual live predictions during inference, triggered by a condition like confidence below a threshold — exactly this scenario, with no dataset-building or retraining involved.","Ground Truth is a labeling tool for building or expanding a training dataset before or during model development — it isn't designed to intercept individual live predictions in a production inference pipeline in real time.","Comprehend doesn't include a built-in human-review escalation workflow; it just returns its own confidence scores, and routing those to a human still requires something like A2I to build the review workflow.","Model Monitor watches for drift in a deployed model's data and predictions over time; it doesn't pause an endpoint for individual low-confidence predictions or route them to a human reviewer."],
explain:"The dataset-vs-live-inference distinction is key: Ground Truth labels data to build or grow a training set; A2I reviews individual predictions a deployed model is already making, in real time, based on a condition such as low confidence."},

{id:"ai1-15",src:"ai",domain:1,type:"single",
stem:"Several teams at a company each independently compute a customer's '30-day average spend' feature — one team calculates it in a nightly batch job for training, another recalculates it on the fly in application code at prediction time. The two calculations occasionally disagree slightly, causing inconsistent predictions between training and production. A teammate suggests just having every team read the feature from a shared set of Parquet files in Amazon S3 instead.\n\nWhy is SageMaker Feature Store still the better choice?",
choices:["Feature Store provides both a low-latency online store for real-time inference and a consistent offline store for training from the same feature definitions, preventing this kind of training/serving skew","Amazon S3 cannot store Parquet files, so the teammate's suggestion is not technically possible","Feature Store is only useful for image and text features, not numeric features like average spend","Reading from shared S3 files already fully solves the problem, so Feature Store would add unnecessary cost"],answer:0,
why:["Feature Store is designed to solve exactly this problem: features are computed once, and both the low-latency online store (real-time serving) and the offline store (training) draw from the same underlying feature definitions, keeping training and inference consistent.","Amazon S3 can absolutely store Parquet files; that's not the limitation here.","Feature Store works with any feature type, including numeric features like average spend — it isn't limited to image or text data.","Shared Parquet files in S3 still don't guarantee low-latency access for real-time serving, and don't inherently prevent two teams from computing or reading the feature differently at different times — Feature Store's managed online/offline consistency is what plain S3 storage doesn't give you."],
explain:"The core training/serving skew problem is solved by having ONE definition of a feature serve both a fast online store (inference) and a batch offline store (training) — which is specifically what Feature Store manages, beyond just centralizing file storage."},

{id:"ai1-16",src:"ai",domain:1,type:"single",
stem:"A retailer's demand-forecasting model was accurate at launch. Six months later, forecast error has grown steadily, and the team suspects shopping behavior has changed. Separately, a regulator asks the team to explain why the model recommended reducing stock for a particular product category.\n\nWhich pairing of AWS capabilities correctly addresses these two DIFFERENT questions?",
choices:["SageMaker Model Monitor for the growing forecast error over time; SageMaker Clarify for explaining why a specific prediction was made","SageMaker Clarify for both questions, since it handles all responsible-AI concerns","SageMaker Model Monitor for both questions, since it covers both drift and explainability","SageMaker Debugger for the growing error over time; SageMaker Model Monitor for explaining individual predictions"],answer:0,
why:["Model Monitor is built to detect exactly this kind of change — production performance degrading over time relative to a training baseline. Clarify is built to explain individual predictions (via feature attribution) and detect bias, which is what the regulator's 'why' question calls for.","Clarify covers bias and explainability, but it doesn't continuously watch a live endpoint for drift over months — that's Model Monitor's job.","Model Monitor watches for drift over time; it doesn't generate feature-attribution explanations for why a specific prediction was made — that's Clarify's role.","Debugger monitors training jobs (like vanishing gradients during training), not production drift after deployment, and Model Monitor doesn't explain individual predictions."],
explain:"Keep the two tools separate by the question each answers: 'has something changed since deployment?' → Model Monitor. 'Why did the model predict this?' → Clarify."},

{id:"ai1-17",src:"ai",domain:1,type:"single",
stem:"A subscription business's churn model was trained before a major product redesign. After the redesign, the mix of customer segments using the product has shifted significantly, AND the behaviors that used to predict churn (like low login frequency) no longer correlate with churn the way they used to.\n\nWhat is happening, and how should the team describe it?",
choices:["Both data drift (the input distribution has shifted) and concept drift (the relationship between inputs and the outcome has changed) are occurring at once","Only concept drift is occurring, since the customer segment mix hasn't actually changed, only behavior patterns have","Only data drift is occurring, since the relationship between features and churn is fixed by definition and cannot change","This is a sign of data leakage, since the model's assumptions from training no longer hold"],answer:0,
why:["The shift in customer segment mix is a change in the input data's distribution (data drift), while the breakdown of the old relationship between login frequency and churn is a change in what the inputs mean for the outcome (concept drift). The scenario describes both happening together.","The scenario explicitly states the segment mix has shifted, which is data drift, in addition to the changed relationship (concept drift) — so it isn't only concept drift.","The scenario explicitly states the relationship between features and the outcome has changed, which is exactly what concept drift means — the relationship is not fixed, so this isn't only data drift.","Data leakage is a training-time problem where information about the target leaks into features before deployment; it doesn't describe a real-world shift discovered after deployment."],
explain:"Data drift and concept drift can and often do happen together after a real-world change like a product redesign — a good monitoring answer should recognize both rather than forcing a single label."},

{id:"ai1-18",src:"ai",domain:1,type:"single",
stem:"A business analyst with no coding experience wants to build a churn-prediction model from a CSV of customer data, entirely through a visual interface, without writing code or opening a notebook. A colleague suggests SageMaker JumpStart since it offers ready-to-use solutions with minimal setup.\n\nWhy is SageMaker Canvas the better fit than JumpStart here?",
choices:["Canvas offers a fully no-code, point-and-click workflow for building and getting predictions from a custom model on the analyst's own data; JumpStart deploys existing pre-built models and solution templates rather than building a fully custom model through a no-code UI","JumpStart is exclusively for computer vision, so it cannot be used for tabular churn data at all","Canvas cannot use CSV files as an input, so it doesn't fit the analyst's use case","JumpStart and Canvas are the same product under two different names, so it doesn't matter which one the analyst uses"],answer:0,
why:["Canvas gives non-technical users a no-code interface to import their own data, train a model on it, and get predictions — matching the analyst's exact need. JumpStart is oriented around deploying and fine-tuning existing pre-built models and solution templates, which isn't quite the same as a guided, no-code custom-model-building workflow.","JumpStart hosts models across many domains, not only computer vision, so this isn't the reason to prefer Canvas.","Canvas is built to import tabular data such as CSV files directly, so this isn't a real limitation.","They serve related but different purposes — Canvas for no-code model building for business users, JumpStart for quickly deploying or fine-tuning existing pre-trained models — so the choice does matter."],
explain:"'No code, build a model on my own data' points to Canvas. 'Quickly deploy or fine-tune an existing pre-trained model or solution template' points to JumpStart."},

{id:"ai1-19",src:"ai",domain:1,type:"multi",pick:2,
stem:"Which of the following are hyperparameters — values set BEFORE training that control how learning happens — rather than parameters the model learns from data? (Select TWO.)",
choices:["The learning rate used by the optimizer","The weights connecting neurons in a trained neural network","The number of trees in a random forest","The embedding vectors learned for each word in a vocabulary"],answer:[0,2],
why:["Set before training begins to control how quickly the optimizer updates weights — a hyperparameter.","Learned from data during training as the model minimizes its loss function — a parameter, not a hyperparameter.","Set before training to control the size and structure of the ensemble — a hyperparameter.","Learned from data during training (often via self-supervised pre-training) — a parameter, not a hyperparameter, even though it's a vector rather than a single number."],
explain:"The test is timing and origin: hyperparameters are chosen by a person (or a search process) before training starts; parameters are learned from data during training, regardless of whether they're single numbers, vectors, or matrices."},

{id:"ai1-20",src:"ai",domain:1,type:"single",
stem:"A team trains a neural network for 200 epochs. Validation loss decreases steadily until epoch 40, then slowly starts increasing, while training loss keeps decreasing all the way through epoch 200.\n\nWhat does this pattern suggest, and what training-time technique directly addresses it?",
choices:["The model begins overfitting after epoch 40; early stopping should halt training around when validation loss stops improving","The model is underfitting throughout, since 200 epochs should always be enough to fully learn the pattern","This pattern indicates data leakage, since training loss should never continue decreasing past epoch 40","The pattern is expected and harmless, since more epochs always produce a better final model"],answer:0,
why:["Training loss continuing to fall while validation loss rises is the classic overfitting signature — the model is starting to memorize training-specific noise. Early stopping halts training near the point where validation performance stops improving, before that memorization sets in.","If the model were underfitting, training loss wouldn't keep decreasing well past epoch 40 while validation performance actively got worse — underfitting shows poor performance on both, not a widening gap.","This divergence between training and validation loss over the course of training is a normal overfitting pattern, not evidence of leakage, which is a data-preparation issue rather than a training-curve issue.","More epochs are not automatically better — training past the point where validation loss starts rising typically produces a worse model on new data, which is exactly why early stopping exists."],
explain:"Number of epochs is a hyperparameter, and this train/validation divergence over epochs is the textbook trigger for early stopping."},

{id:"ai1-21",src:"ai",domain:1,type:"single",
stem:"A data scientist creates a new column, 'days_since_last_purchase,' by subtracting each transaction's date from the customer's most recent purchase date. Separately, a computer-vision team creates additional training images by rotating, flipping, and slightly recoloring their existing photos.\n\nWhich statement correctly distinguishes these two activities?",
choices:["The first is feature engineering (deriving a new input variable from existing data); the second is data augmentation (creating additional training examples from existing ones) — related but different techniques","Both activities are examples of feature engineering, since both modify the raw data before training","Both activities are examples of data augmentation, since both increase the amount of usable information available to the model","The first is data augmentation and the second is feature engineering — the labels in the first option are reversed"],answer:0,
why:["Feature engineering creates or transforms input variables (columns) for existing examples — like deriving days-since-last-purchase. Data augmentation instead creates new training examples by applying transformations to existing ones — like rotated or recolored image copies. Both are data-preparation techniques, but they serve different purposes.","The image transformations don't create a new column for existing rows — they create additional rows (new image examples), which is augmentation, not feature engineering.","The new date-difference column doesn't create additional training examples — it creates a new variable for existing examples, which is feature engineering, not augmentation.","The definitions given in the first option are correctly assigned, not reversed: deriving a column is feature engineering, and generating new example images is augmentation."],
explain:"Feature engineering changes what information is available about each existing example (columns). Data augmentation changes how many examples exist (rows), typically by transforming existing ones."},

{id:"ai1-22",src:"ai",domain:1,type:"single",
stem:"Before training a model, a data scientist first computes summary statistics, plots distributions, and checks correlations between variables — without changing anything yet. Afterward, based on what was found, she removes outliers, fills missing values, and normalizes numeric columns.\n\nWhich statement correctly labels these two phases?",
choices:["The first phase is exploratory data analysis (EDA); the second is data preprocessing — EDA informs what preprocessing steps are actually needed","Both phases are exploratory data analysis, since both happen before model training","Both phases are data preprocessing, since both involve working with the raw data","The order is backwards — preprocessing always happens before EDA is possible"],answer:0,
why:["EDA is the investigative phase — understanding the data's characteristics, quality, and relationships without changing it. Preprocessing is the phase where the data is actually transformed (outlier removal, imputation, normalization) based on what EDA revealed.","The second phase involves actively changing the data (removing outliers, filling values), which is preprocessing, not further exploration.","The first phase doesn't change any data — it's purely investigative, which is what makes it EDA rather than preprocessing.","EDA typically comes first because you need to understand what's wrong or notable in the data (missing values, outliers, skew) before deciding how to preprocess it — doing preprocessing first, blind, risks fixing the wrong things."],
explain:"EDA (look, don't touch) typically precedes preprocessing (now change the data), because what you find during EDA determines which preprocessing steps are actually needed."},

{id:"ai1-23",src:"ai",domain:1,type:"single",
stem:"A hotel chain wants to classify thousands of guest reviews as positive, negative, neutral, or mixed. A vendor proposes writing a custom prompt for a large language model in Amazon Bedrock to classify each review, instead of using Amazon Comprehend's built-in sentiment analysis.\n\nWhat is the strongest argument for using Amazon Comprehend instead of the Bedrock LLM approach for this specific task?",
choices:["Comprehend's built-in sentiment analysis is a purpose-built, simpler, and typically cheaper API call for a narrow, well-defined task like this, with no prompt design or model selection required","A large language model in Bedrock is technically incapable of producing a sentiment label","Comprehend is the only AWS service that can process natural language text at all","Using an LLM would require first converting all reviews to embeddings, which Comprehend does not require"],answer:0,
why:["Both approaches could technically produce a sentiment label, but for a narrow, standard task like this, Comprehend is a simpler, purpose-built API call — no prompt engineering, model selection, or output parsing needed — and is generally the more cost-effective choice for high-volume narrow classification.","An LLM can absolutely be prompted to output a sentiment label — that's not a technical limitation, it's just more setup than necessary for this narrow task.","Bedrock's LLMs also process natural language text; Comprehend isn't uniquely capable of that.","Classifying sentiment with an LLM doesn't require a separate embedding step — the model can classify directly from the prompt text, so this isn't a real distinction between the two approaches."],
explain:"When a narrow, well-defined NLP task already has a purpose-built AI service, that service is usually simpler and cheaper than standing up a general-purpose LLM solution — even though the LLM could technically do the job too."},

{id:"ai1-24",src:"ai",domain:1,type:"single",
stem:"A call center wants a single AWS capability that transcribes customer calls AND natively reports caller and agent sentiment for each call, without the team wiring together a separate transcription service and a separate sentiment-analysis service.\n\nWhich AWS capability most directly meets this requirement?",
choices:["Amazon Transcribe (standard) piped into Amazon Comprehend","Amazon Transcribe Call Analytics, which includes built-in caller and agent sentiment as part of its call analytics output","Amazon Polly with SSML sentiment tags","Amazon Comprehend alone, applied directly to the audio file"],answer:1,
why:["This combination works and is a valid architecture, but it's exactly the 'wiring two services together' approach the question says to avoid — standard Transcribe only produces a transcript and doesn't include sentiment on its own.","Transcribe Call Analytics is purpose-built for contact centers and natively reports call-level insights, including caller and agent sentiment, alongside the transcript, from a single capability.","Polly converts text to speech; it has no sentiment-tagging capability and works in the opposite direction (text to audio, not audio to insights).","Comprehend analyzes text, not raw audio — it would still need a transcript produced by a speech-to-text service first."],
explain:"Amazon Transcribe Call Analytics is the purpose-built service for contact centers that bundles transcription with call-level insights like sentiment, rather than requiring generic Transcribe to be combined with Comprehend."},

{id:"ai1-25",src:"ai",domain:1,type:"single",
stem:"A social media platform wants to automatically flag uploaded images that likely contain nudity, violence, or other unsafe content, and needs a confidence score for each flagged category so moderators can prioritize review.\n\nWhich AWS capability is purpose-built for this, as opposed to a more general image-analysis capability?",
choices:["Amazon Rekognition's content moderation capability (DetectModerationLabels), which returns unsafe-content categories with confidence scores","Amazon Rekognition's general object and scene detection (DetectLabels), which can also happen to return objects related to unsafe content","Amazon Textract, since it can detect any text overlaid on an unsafe image","Amazon Comprehend, since it can detect toxic language in image captions"],answer:0,
why:["This is the moderation-specific capability, returning categories like explicit or suggestive content and violence, each with a confidence score — exactly the prioritized-review use case described.","General label detection identifies objects and scenes broadly; it isn't designed to specifically categorize or score unsafe content the way the moderation-specific capability is.","Textract extracts text from documents and images; it doesn't assess whether visual content itself is unsafe.","Comprehend analyzes text, not images, and would only help with a caption if one exists — not the image content itself."],
explain:"Rekognition's moderation-specific API is purpose-built to return unsafe-content categories with confidence scores; its general label-detection API could surface some overlapping objects but isn't designed or scored for content moderation."},

{id:"ai1-26",src:"ai",domain:1,type:"single",
stem:"A news website already uses a service to convert article text into natural-sounding narrated audio. Now they want certain words emphasized and natural pauses inserted at specific points in the narration, without recording new audio manually.\n\nWhich AWS capability allows this level of control over the generated speech?",
choices:["Amazon Polly with SSML (Speech Synthesis Markup Language) tags to control emphasis, pauses, and pronunciation","Amazon Transcribe, since it can also adjust how speech sounds when converting it back to text","Amazon Comprehend, since it can identify which words in the article are important","Amazon Lex, since it manages the flow of a spoken conversation"],answer:0,
why:["Polly supports SSML tags that let you control emphasis, insert pauses, adjust pronunciation, and more — directly addressing the need for fine-grained control over narration without new manual recording.","Transcribe converts speech to text; it plays no role in generating or controlling synthesized speech.","Comprehend can identify important words or phrases in text (such as key phrases), but has no mechanism to control how synthesized audio actually sounds.","Lex manages conversational flow and intent recognition for chatbots; it doesn't control fine-grained speech synthesis output."],
explain:"When a question adds a requirement like emphasis or pauses on top of basic text-to-speech, look for SSML support — that's Polly's mechanism for fine control over generated speech."},

{id:"ai1-27",src:"ai",domain:1,type:"single",
stem:"An online retailer wants real-time, per-user product recommendations based on browsing and purchase history, and also wants the system to handle brand-new users with no history yet by falling back to popularity-based recommendations — all without building custom ML models from scratch.\n\nWhich AWS service is designed to handle both of these needs?",
choices:["Amazon Personalize, which provides real-time personalized recommendations and includes recipes designed to handle common scenarios like new users with limited history","Amazon Forecast, since predicting demand and predicting what a user will buy are the same underlying problem","Amazon Kendra, since it can search a product catalog for relevant items","Amazon Comprehend, since it can analyze browsing text to infer preferences"],answer:0,
why:["Personalize is a managed recommendation service built to generate real-time, personalized recommendations from user interaction data, with built-in recipes designed to handle common recommendation scenarios, including limited-history situations, without building custom ML models.","Forecast predicts future numeric values over time (like demand), a different problem from ranking items for an individual user based on their behavior.","Kendra is a search service that retrieves relevant documents or items for a query; it isn't built to generate personalized, per-user behavioral recommendations.","Comprehend analyzes text for sentiment, entities, and key phrases; it doesn't generate ranked product recommendations from browsing and purchase behavior."],
explain:"'Real-time, per-user recommendations, minimal custom ML work' is Personalize's core purpose; the other services solve genuinely different problems."},

{id:"ai1-28",src:"ai",domain:1,type:"single",
stem:"A clinic wants a bot that recognizes a caller's intent to book an appointment, collects the date, time, and doctor's name through back-and-forth conversation, and integrates natively with Amazon Connect for voice channels. A colleague suggests Agents for Amazon Bedrock instead, since it can also orchestrate multi-step conversations.\n\nWhat is the strongest reason to prefer Amazon Lex for this specific use case?",
choices:["Lex is purpose-built around intents and slots (like date, time, doctor) and has native, well-established integration with Amazon Connect for voice and chat channels","Agents for Amazon Bedrock cannot process natural language at all","Lex is the only AWS service capable of having a multi-turn conversation","Amazon Connect only works with Amazon Lex and no other AWS conversational service"],answer:0,
why:["Lex's core abstractions — intents and slots — map directly onto 'recognize the appointment-booking intent' and 'collect date, time, doctor as slots,' and it has mature, native integration with Amazon Connect, exactly the delivery channel described.","Bedrock Agents are built on top of foundation models, which absolutely process natural language — that's not a real limitation.","Both Lex and Bedrock Agents can manage multi-turn conversations; the distinguishing factor here is Lex's purpose-built intents/slots model and native Connect integration, not an exclusive capability.","Amazon Connect can integrate with other conversational approaches as well; the question is about which is the better fit, not an exclusive requirement."],
explain:"Bedrock Agents and Lex can both hold a conversation, but Lex's intents/slots framework and native Amazon Connect integration make it the more direct, purpose-built fit for a structured, slot-filling task like appointment booking."},

{id:"ai1-29",src:"ai",domain:1,type:"single",
stem:"A global support team receives messages in many languages and doesn't know in advance which language each message is in. They want each message automatically identified and translated into English in real time for their English-speaking agents.\n\nWhich AWS capability handles BOTH the language identification and the translation, without the team building custom logic to detect the language first?",
choices:["Amazon Translate, which can automatically detect the source language and translate to the target language in the same call","Amazon Comprehend alone, since it can both detect language and translate text","Amazon Transcribe, since it can detect spoken language automatically","Amazon Lex, since it manages multi-language conversations"],answer:0,
why:["Translate supports automatic source-language detection as part of translation, so the team doesn't need a separate language-identification step before translating — one call handles both.","Comprehend can detect the dominant language of a text, but it doesn't perform translation — that's Translate's job.","Transcribe converts speech to text and can identify spoken language, but the scenario is about text messages, not audio, and Transcribe doesn't translate.","Lex manages conversational flow and intents; it isn't a translation service."],
explain:"Amazon Translate can auto-detect the source language as part of the same request, which is the detail that eliminates having to bolt on a separate detection step."},

{id:"ai1-30",src:"ai",domain:1,type:"match",
stem:"Match each scenario to the type of machine learning being described. Each type may be used once or not at all. Read carefully — one scenario is easy to mislabel. (Select FOUR.)",
prompts:["A team has 500 labeled photos of a rare defect and 50,000 unlabeled photos from the same production line, and wants to make the most of both sets","A streaming service groups viewers into behavioral segments with no predefined categories","A model predicts loan default using thousands of past applications with known outcomes","A trading bot adjusts its strategy over time based on profit-and-loss feedback from each trade it makes"],
options:["Supervised learning","Unsupervised learning","Reinforcement learning","Semi-supervised learning"],answer:[3,1,0,2],
why:["Learns from labeled examples where the correct output is already known, such as past loan outcomes — matching the loan-default scenario, not the small-labeled/large-unlabeled scenario.","Finds structure in data with no labels at all, such as grouping viewers into segments without predefined categories.","An agent learns by taking actions and receiving reward-like feedback, such as profit and loss from trades.","Combines a small labeled set with a much larger unlabeled set — the defining trigger for the defect-detection scenario, since the team has far more unlabeled than labeled images."],
explain:"The trap is the defect-detection scenario: it does have some labels, so it's tempting to call it supervised learning — but the defining feature, a small labeled set plus a much larger unlabeled set, is the specific trigger for semi-supervised learning instead."},

{id:"ai1-31",src:"ai",domain:1,type:"single",
stem:"A subscription company wants to predict, for each customer, which ONE of four outcomes will happen next month: stays, downgrades, upgrades, or cancels.\n\nWhat type of ML problem is this, and how does it differ from simply predicting whether a customer cancels or not?",
choices:["Multi-class classification, since there are four mutually exclusive categories to predict, rather than just the two in binary classification","Binary classification, since 'cancels' is still just one of the possible outcomes","Regression, since the four outcomes could be ranked from best to worst for the business","Clustering, since the four outcomes represent natural groupings discovered from the data"],answer:0,
why:["Predicting one of several mutually exclusive categories (stays, downgrades, upgrades, cancels) is multi-class classification — a direct extension of binary classification but with more than two possible labels.","Binary classification predicts one of exactly two categories; here there are four possible outcomes to choose from, which makes it multi-class instead.","The four outcomes are categories, not numeric values, so this isn't a regression problem even if they could be loosely ranked.","The four outcome categories are already known and labeled from historical data, not discovered from unlabeled data — that rules out clustering, which is unsupervised."],
explain:"Binary classification is two classes; multi-class classification is more than two mutually exclusive classes. Having more than two known, labeled categories is what shifts this from binary to multi-class."},

{id:"ai1-32",src:"ai",domain:1,type:"single",
stem:"Two fraud models are compared on the same imbalanced test set (0.5% fraud). Model A has 99.5% accuracy and an AUC of 0.62. Model B has 97% accuracy and an AUC of 0.91.\n\nWhich model actually separates fraud from non-fraud better, and why does accuracy fail to reveal this?",
choices:["Model B, because AUC measures how well a model ranks positives above negatives across all thresholds, while accuracy on this imbalanced data is dominated by the large majority class","Model A, because higher accuracy always means a better classifier regardless of class balance","They are equally good, since both scores are just different ways of expressing the same underlying performance","Model A, because a lower AUC combined with higher accuracy means the model is more conservative and therefore safer"],answer:0,
why:["AUC reflects how well a model ranks true fraud cases above legitimate ones across every possible threshold, unaffected by class imbalance. Model A's high accuracy mostly reflects that predicting 'not fraud' for almost everyone is already correct 99.5% of the time on this imbalanced data — it says little about whether fraud itself is being detected well.","On heavily imbalanced data, a model that mostly predicts the majority class can achieve very high accuracy while barely detecting the minority class at all — accuracy alone is misleading here.","AUC and accuracy measure different things and can disagree sharply on imbalanced data, as this example shows — they are not interchangeable.","A lower AUC indicates worse ranking ability between the two classes, not increased caution or safety — it doesn't map onto a 'more conservative' interpretation."],
explain:"On imbalanced data, accuracy can look great while a model is nearly useless at the actual task; AUC is far more informative because it measures ranking ability between classes independent of class balance."},

{id:"ai1-33",src:"ai",domain:1,type:"single",
stem:"A team splits data into training, validation, and test sets. During development, they tune hyperparameters using the validation set. Right before their final report is due, the model still underperforms, so they also try a few settings directly against the test set and report whichever combination scores highest there.\n\nWhat is wrong with this final step, specifically?",
choices:["Using the test set to choose among settings makes the reported test score an optimistic, biased estimate — the test set is no longer 'unseen' once it's used to pick among options","Nothing is wrong, since the validation set was already used correctly earlier in the process","The problem is that a validation set was used at all — only training and test sets should ever be created","This is fine as long as the final chosen setting is also re-validated on the validation set afterward"],answer:0,
why:["The test set's entire purpose is to provide one honest, final, unbiased estimate of performance on unseen data. The moment it's used to choose among multiple settings — even a few — those choices have effectively been fit to the test set, so the resulting score no longer reflects true unseen-data performance.","The validation-set tuning earlier was appropriate, but that doesn't make the later test-set-based selection acceptable — the problem is specifically the final step, not the process as a whole.","A validation set is a standard and appropriate part of the process, used exactly for the hyperparameter tuning described earlier — the issue is reusing the test set for selection, not having a validation set.","Re-checking against validation afterward doesn't undo the leakage that already happened — the reported test score is still biased because the test set already influenced which setting was chosen."],
explain:"This is a subtle form of data leakage: the test set stops being a fair, unseen benchmark the instant it's used — even briefly — to choose between candidate models or settings."},

{id:"ai1-34",src:"ai",domain:1,type:"single",
stem:"A fraud model scored very well in development. In production, a data scientist notices one of the training features, 'dispute_opened_flag,' is set to true only when a customer later disputes a charge — something that, in the real world, happens well after the transaction is scored for fraud in real time.\n\nWhat problem does this feature most likely cause, and why is it easy to miss?",
choices:["Target/data leakage: the feature encodes information that would only be available after the outcome is already known, inflating development performance in a way that won't hold up at real prediction time","Underfitting: the feature is too simple to help the model learn anything useful","Concept drift: the meaning of a dispute has changed over time","Class imbalance: disputes are rare, so this feature disproportionately affects a small number of rows"],answer:0,
why:["A feature only populated after the outcome has already occurred effectively lets the model 'peek' at information tied to the answer, inflating offline metrics in a way that can't be replicated at real prediction time — this is target leakage, and it's easy to miss because the feature doesn't obviously reference the label by name.","A leaking feature typically makes a model look artificially good, not simple or unhelpful — this isn't a description of underfitting.","The scenario describes a structural flaw in the training data (a feature only available after the fact), not a change in real-world behavior over time.","Class imbalance is about the relative frequency of outcome classes, not about whether a feature is available at prediction time — a separate issue from what's described here."],
explain:"Leakage isn't always as obvious as a feature literally named after the label — look for any feature that could only be known after the event you're trying to predict has already happened."},

{id:"ai1-35",src:"ai",domain:1,type:"single",
stem:"A logistics company is deciding whether machine learning is appropriate for a proposed project: automatically calculating each shipment's customs duty using a government-published tariff formula that takes exact inputs (item category code, declared value, country of origin) and must match the government's calculation exactly, with zero tolerance for deviation, and where every calculation must be auditable line by line.\n\nWhat is the strongest reason ML is NOT appropriate here, even though there is plenty of historical shipment data available?",
choices:["The output must exactly match a fully known, deterministic formula with zero tolerance for deviation, which a statistical model can't guarantee even with abundant data","There isn't enough historical data available to train a model","The inputs (category code, value, country) aren't the kind of data ML models can process","Customs duty calculations change too often for any system, ML or otherwise, to keep up with"],answer:0,
why:["Even with abundant, high-quality data, an ML model is a statistical approximation and can't guarantee it exactly reproduces a fully known formula on every input, especially edge cases — which fails the zero-deviation, fully-auditable requirement.","The scenario states plenty of historical data exists — data availability isn't the limiting factor here.","Category codes, values, and countries are exactly the kind of structured, tabular data ML models handle routinely — that's not the issue.","The scenario is about matching a fixed government formula exactly, not about the formula changing frequently — and deterministic code is, if anything, easier to update for formula changes than a model would be to retrain."],
explain:"Plenty of data doesn't make ML the right tool. When the exact logic is already fully known and must be reproduced with zero deviation and full auditability, that's precisely the case for deterministic code instead of a trained model."},

{id:"ai1-36",src:"ai",domain:1,type:"single",
stem:"An ML team's current workflow — data processing, training, evaluation, and conditional model registration — is scripted manually and run by hand whenever new data arrives, which is error-prone and inconsistent between runs. They want this automated as a repeatable, version-controlled workflow within their existing SageMaker environment, without adopting a separate general-purpose workflow orchestration service.\n\nWhich SageMaker capability fits this need?",
choices:["SageMaker Pipelines, which defines and orchestrates a repeatable, automated ML workflow as a series of connected steps within SageMaker","SageMaker Clarify, since it can automatically re-run a workflow whenever bias is detected","AWS Step Functions, since it is the only AWS service capable of running steps in sequence","SageMaker Ground Truth, since it manages the labeling step of the workflow end-to-end"],answer:0,
why:["Pipelines is SageMaker's built-in tool for defining and orchestrating a repeatable ML workflow — the MLOps piece — directly matching the requirement to automate the existing manual process within SageMaker.","Clarify detects bias and explains predictions — it doesn't orchestrate or trigger workflow runs.","Step Functions is a valid general-purpose orchestration service and could technically be used, but the scenario specifically asks for a fit within the existing SageMaker environment without adopting a separate service, which points to Pipelines instead.","Ground Truth only handles the labeling step; it doesn't orchestrate the full multi-step workflow described (processing, training, evaluation, conditional registration)."],
explain:"When a workflow needs to be automated and repeatable specifically within SageMaker's own tooling, Pipelines is the purpose-built answer; a general orchestrator like Step Functions could also work but isn't the SageMaker-native choice."},

{id:"ai1-37",src:"ai",domain:1,type:"single",
stem:"A company's governance policy requires every model version to be cataloged with its training metrics, and requires an explicit approval step before any version can be deployed to production. A teammate suggests just storing each model's container image in Amazon ECR with a descriptive tag, since ECR already versions images.\n\nWhy does this not fully satisfy the policy, and what should be used instead?",
choices:["SageMaker Model Registry, because ECR versions container images but doesn't track model-specific metadata like training metrics or manage an approval workflow before deployment","Amazon ECR is sufficient on its own, since image tags can encode any information the team needs, including approval status","SageMaker Feature Store, because it already tracks metadata for everything used in the ML lifecycle, including models","AWS CloudTrail, because it logs every model-related API call, which satisfies the approval requirement"],answer:0,
why:["ECR is built to store and version container images, not to catalog model-specific metadata like training metrics or manage an approval workflow — Model Registry adds exactly those capabilities on top of versioning.","Encoding information into a free-text tag isn't the same as a managed metadata schema and approval workflow — it's easy to be inconsistent, and there's no built-in approval gate enforced by ECR itself.","Feature Store tracks and serves ML features, not model artifacts, versions, or approval status — that's a different part of the lifecycle.","CloudTrail records that API calls happened, not whether a specific model version was reviewed and approved for deployment — it's an audit log, not an approval workflow."],
explain:"Versioning container images (ECR) and cataloging models with metadata and an approval workflow (Model Registry) are two different concerns — a governance policy that requires the latter needs Model Registry specifically."},

{id:"ai1-38",src:"ai",domain:1,type:"single",
stem:"A factory has 500,000 labeled photos of products marked defective or not defective. A vendor proposes using a Support Vector Machine (SVM) on hand-crafted pixel-intensity features, arguing it's a well-understood, mathematically simple algorithm.\n\nWhat is the strongest reason a deep learning approach would likely outperform the SVM approach here?",
choices:["Deep learning models can automatically learn relevant visual features directly from raw pixels at scale, rather than relying on hand-crafted features that may not capture what actually distinguishes defects","SVMs cannot be used for classification tasks of any kind","There isn't enough labeled data for a deep learning model to be useful, but there is enough for an SVM","Hand-crafted pixel-intensity features are always more accurate than learned features for any image task"],answer:0,
why:["With 500,000 labeled images, a deep learning model can learn its own hierarchy of visual features directly from raw pixels, often capturing subtle patterns that hand-crafted features (like simple pixel intensity) miss entirely — exactly why unstructured, high-volume image data is deep learning's strength.","SVMs are a legitimate classification algorithm; the issue here isn't whether they can classify at all, but whether hand-crafted features are the bottleneck compared to deep learning's automatic feature learning on image data.","500,000 labeled images is a substantial dataset that favors deep learning, which tends to need more data than classical approaches to reach its full potential — this reverses the actual data-size logic.","Hand-crafted features are not universally superior — for complex, high-dimensional data like images, learned features usually capture more relevant patterns than manually chosen ones."],
explain:"The real bottleneck for the SVM approach isn't the algorithm itself — it's the hand-crafted features. Deep learning's core advantage on unstructured data like images is that it learns useful features automatically instead of relying on ones a person designed by hand."},

{id:"ai1-39",src:"ai",domain:1,type:"single",
stem:"A company deployed a new recommendation model and wants to know whether it's actually driving more revenue, not just whether it's technically accurate. The data science team reports the model's precision@10 improved from 0.31 to 0.38 compared to the old model.\n\nWhy is this NOT sufficient evidence that the new model is creating business value, and what would be a better way to measure that?",
choices:["Precision@10 measures recommendation relevance, not business outcomes; a controlled A/B test comparing revenue per user between the new and old model would directly measure business impact","Precision@10 is actually a business metric, so no further evidence is needed","The team should report the model's training loss instead, since it's a more fundamental measure of quality","Any improvement in a model-quality metric automatically translates into proportional revenue growth"],answer:0,
why:["Precision@10 tells you how relevant the top recommendations are, which is a model-quality metric — it doesn't by itself prove customers bought more or spent more. A controlled A/B test comparing revenue per user between the old and new model isolates the model's actual causal effect on the business outcome that matters.","Precision@10 is a model-quality metric, not a business metric like revenue, conversion rate, or customer lifetime value.","Training loss is even further removed from business outcomes than precision@10 — it describes the optimization process, not real-world impact.","There's no guaranteed proportional relationship between a model-quality metric improving and revenue actually increasing — the connection has to be measured directly, which is exactly why controlled experiments like A/B tests matter."],
explain:"Model-quality metrics (precision, recall, AUC, loss) and business metrics (revenue, conversion rate, CLV) answer different questions. Proving business impact requires directly measuring a business outcome, ideally through a controlled comparison like an A/B test."},

{id:"ai1-40",src:"ai",domain:1,type:"single",
stem:"A startup wants to deploy an open-source computer-vision model, fine-tune it later on its own labeled data, and needs to choose the specific GPU instance type it runs on for cost-control reasons. A teammate suggests Amazon Bedrock since it also offers quick access to pre-trained models.\n\nWhy is SageMaker JumpStart the better fit than Bedrock here?",
choices:["JumpStart hosts a wide range of pre-trained open-source models that you deploy on infrastructure and instance types you choose yourself, and later fine-tune, matching the need for instance-level control","Bedrock cannot be used to access any pre-trained models","JumpStart and Bedrock are interchangeable, so the choice makes no practical difference here","Bedrock always provides better model accuracy than any model available through JumpStart"],answer:0,
why:["JumpStart is designed around deploying pre-trained (often open-source) models onto SageMaker infrastructure where you pick the instance type, and later fine-tuning them — directly matching the need for instance-level cost control plus later fine-tuning.","Bedrock's entire purpose is providing access to pre-trained foundation models — the issue isn't that it can't provide models, it's that it doesn't expose the underlying compute instance choice the way JumpStart does.","They serve different needs: Bedrock is a fully managed, serverless API to foundation models with no infrastructure choices exposed; JumpStart gives you a deployable pre-trained model on infrastructure you configure — the choice matters when instance-level control is required.","Model accuracy depends on the specific model and task, not on which of these two access methods is used — this isn't a valid basis for choosing between them."],
explain:"When a question emphasizes controlling the specific instance type or infrastructure a pre-trained model runs on, that points to SageMaker JumpStart rather than Bedrock's fully managed, infrastructure-free API."},

{id:"ai1-41",src:"ai",domain:1,type:"single",
stem:"A medical imaging company has 1,000 labeled scans and 100,000 unlabeled scans, and labeling more requires expensive specialist time. A vendor proposes using transfer learning from a model pre-trained on general (non-medical) images instead of semi-supervised learning.\n\nWhat is the key difference between these two approaches for this situation?",
choices:["Transfer learning reuses knowledge from a model trained on a different (often unrelated) dataset or task; semi-supervised learning instead uses the company's own large pool of unlabeled scans alongside its small labeled set — they address the data problem differently and aren't mutually exclusive","They are the same technique with two different names","Transfer learning requires labeled data from the target domain, while semi-supervised learning cannot use any labeled data at all","Semi-supervised learning is strictly worse than transfer learning and should never be used when transfer learning is available"],answer:0,
why:["Transfer learning starts from a model already trained on a different dataset — possibly a very different domain, like general photos — and adapts it. Semi-supervised learning instead makes use of the company's own 100,000 unlabeled scans directly, combined with the 1,000 labeled ones. Both are valid responses to limited labels, and a team might combine them rather than treating this as an either/or choice.","They solve a similar underlying problem (limited labeled data) through different mechanisms — reusing an external pre-trained model versus leveraging in-domain unlabeled data — so they aren't the same technique.","Semi-supervised learning explicitly requires some labeled data (the small labeled set) alongside the unlabeled data — it doesn't work with zero labels; transfer learning doesn't strictly require target-domain labels either, since fine-tuning approaches vary.","Neither technique is strictly superior in all cases — the right choice, or combination, depends on how related the pre-trained model's original data is to medical scans, and how valuable the 100,000 unlabeled in-domain images are."],
explain:"Transfer learning and semi-supervised learning both help when labels are scarce, but they use different sources of extra information — an externally pre-trained model versus your own unlabeled in-domain data — and a real solution often combines both rather than picking one exclusively."},

{id:"ai1-42",src:"ai",domain:1,type:"single",
stem:"An operations team wants to detect unusual spikes in server metrics in near real time. Historical data has no labels marking which past points were true anomalies, and new types of anomalies may appear that were never seen before.\n\nWhy would Random Cut Forest be a better fit here than training an XGBoost classifier to predict 'is this point anomalous'?",
choices:["Random Cut Forest is unsupervised and assigns anomaly scores without needing labeled examples of past anomalies, which also lets it flag novel anomaly patterns it has never explicitly seen before","XGBoost cannot process numeric time-series metrics at all","Random Cut Forest requires more labeled data than XGBoost, making it a worse choice when labels are scarce","XGBoost and Random Cut Forest solve the exact same problem in the exact same way, so either would work identically"],answer:0,
why:["Random Cut Forest doesn't need labeled anomalies to train — it learns what 'normal' looks like and scores how much a new point deviates from that, which naturally extends to catching new, never-before-seen anomaly patterns. An XGBoost classifier needs labeled examples of actual anomalies to learn from, which the team doesn't have.","XGBoost can process numeric time-series-style features; the issue is the lack of labels for a supervised classifier, not an inability to handle the data type.","This reverses the actual requirement — Random Cut Forest is the one that does NOT require labeled data, which is precisely its advantage in this labels-scarce scenario.","The two take fundamentally different approaches — unsupervised deviation-from-normal scoring versus supervised classification from labeled examples — so they aren't interchangeable here, especially given the lack of labels."],
explain:"No labeled anomalies plus the possibility of unseen anomaly types is the specific combination that favors an unsupervised approach like Random Cut Forest over a supervised classifier that requires labeled positive examples to learn from."},

// ---------- AI-generated: Domain 3 (Applications of Foundation Models) ----------
{id:"ai3-01",src:"ai",domain:3,type:"single",
stem:"A startup needs to call Claude, Titan, Llama, and Mistral through a single API, wants zero servers or GPU instances to manage, and doesn't need to control the underlying instance type. A teammate suggests SageMaker JumpStart since it also provides access to many of these same open models.\n\nWhy is Amazon Bedrock the better fit than JumpStart here?",
choices:["Bedrock is a fully serverless, managed API across multiple FM providers with zero infrastructure to provision or manage, whereas JumpStart deploys models onto SageMaker infrastructure that you configure and pay for even when idle","JumpStart cannot provide access to Claude or Titan under any circumstances","Bedrock and JumpStart are simply two names for the same underlying service","JumpStart is strictly more expensive than Bedrock in every scenario"],answer:0,
why:["Bedrock's core value proposition is zero infrastructure — you call a managed API and pay per request. JumpStart deploys a model onto SageMaker infrastructure (instances) that you choose and that keep running, and costing money, whether or not you're actively using them — the opposite of 'zero servers to manage.'","JumpStart's catalog leans toward open-source models; the specific set of providers available differs between the two services, but the deciding factor here is the infrastructure model, not provider availability.","They're built on different underlying architectures — Bedrock as a serverless managed API, JumpStart as deployable models on your own SageMaker infrastructure — so they are not interchangeable.","Relative cost depends heavily on usage patterns (steady high-volume traffic vs. sporadic calls); it isn't a fixed rule that one is always cheaper than the other."],
explain:"The deciding detail is 'zero infrastructure to manage' — that's Bedrock's defining trait. JumpStart still involves choosing and paying for SageMaker instances, even for a pre-trained model."},

{id:"ai3-02",src:"ai",domain:3,type:"single",
stem:"A team has a large proprietary labeled dataset and wants to train a custom gradient-boosted tree model, writing their own feature engineering and training code, with full control over the algorithm and infrastructure. A colleague suggests fine-tuning a foundation model in Amazon Bedrock instead, since Bedrock also supports customization with labeled data.\n\nWhy is SageMaker the better fit than Bedrock fine-tuning here?",
choices:["Bedrock fine-tuning customizes a provider's foundation model within limits the provider allows; it doesn't offer a blank slate to write custom training code or choose a completely different algorithm like gradient boosting, which SageMaker does support","Bedrock cannot accept any labeled training data","SageMaker cannot train tree-based models like gradient boosting","Bedrock fine-tuning and SageMaker custom training produce mathematically identical models, so either would work"],answer:0,
why:["Bedrock's fine-tuning adapts an existing foundation model within the boundaries the model provider allows — it isn't a general-purpose custom training environment. The team wants to write its own training code and use a completely different kind of algorithm (gradient boosting), which requires SageMaker's full build/train/deploy environment.","Bedrock fine-tuning explicitly accepts labeled data for customization — the limitation isn't accepting data, it's the scope of what can be customized.","SageMaker directly supports gradient-boosted tree algorithms, such as its built-in XGBoost, among many others — exactly the kind of full-control custom training it's designed for.","Fine-tuning an existing foundation model and training a custom gradient-boosted tree model from scratch are fundamentally different processes producing different kinds of models — they aren't interchangeable outcomes."],
explain:"Bedrock's customization options (prompt engineering, RAG, fine-tuning, continued pre-training) all still operate on an existing foundation model. Writing entirely custom training code for a different kind of algorithm is a SageMaker job."},

{id:"ai3-03",src:"ai",domain:3,type:"match",
stem:"Match each situation to the SageMaker capability that addresses it. (Select THREE.)",
prompts:["A team keeps finding that a column meant to average about 50 actually contains invalid values like -1 and 999, and wants a visual way to spot and fix this before training","Labeling would take one engineer several months by hand, so the team wants a workflow where a model gradually takes over labeling the easy cases while people focus on the hard ones","Two separate teams keep computing the same customer feature slightly differently, causing mismatches between what a model saw in training and what it sees serving live traffic"],
options:["SageMaker Data Wrangler","SageMaker Ground Truth","SageMaker Feature Store","SageMaker Autopilot","SageMaker Model Monitor"],answer:[0,1,2],
why:["Data Wrangler gives a visual interface for spotting and fixing exactly this kind of data-quality issue (outliers, invalid values) before training.","Ground Truth combines human labeling with active learning, so the model can gradually take over confidently-labeled cases while people handle the harder ones.","Feature Store's online and offline stores share the same feature definitions, which is what keeps training-time and serving-time versions of a feature consistent.","Autopilot automates model selection, training, and tuning — it doesn't address data-quality inspection, labeling, or feature consistency, so it doesn't fit any of these three scenarios.","Model Monitor watches a deployed model for drift over time — it doesn't address data cleaning, labeling, or feature-consistency issues that happen before or during training."],
explain:"Each SageMaker tool maps to a specific pain point: messy raw values → Data Wrangler; expensive manual labeling at scale → Ground Truth's active learning; training/serving feature mismatches → Feature Store's shared online/offline store."},

{id:"ai3-04",src:"ai",domain:3,type:"single",
stem:"A deployed loan-approval model's overall accuracy hasn't changed in six months. However, the team is concerned that the model's error rate for a specific demographic subgroup may have started drifting away from other groups over that same period, and wants this monitored continuously going forward, not just checked once.\n\nWhich SageMaker capability is specifically designed for ONGOING detection of this kind of subgroup-level drift after deployment?",
choices:["SageMaker Model Monitor, which can continuously track bias drift in a deployed model's predictions over time, not just overall accuracy","SageMaker Clarify, since it's the only tool that understands the concept of bias at all","SageMaker Autopilot, since it automatically avoids biased outcomes when building models","Neither tool addresses this; subgroup fairness can only be checked manually"],answer:0,
why:["Model Monitor's drift detection explicitly includes bias drift as one of its monitored dimensions, alongside data quality, model quality, and feature attribution drift — making it the right tool for continuous, ongoing tracking after deployment.","Clarify does detect and explain bias, but its checks are typically run at specific points — before training (on data) or after training (on a model) — rather than as continuous, ongoing production monitoring, which is specifically what the question asks for.","Autopilot automates model building and tuning; it doesn't include a bias-avoidance guarantee or continuous fairness monitoring.","AWS does provide managed tooling for this (Model Monitor's bias drift detection), so it isn't limited to manual checking."],
explain:"Both Clarify and Model Monitor touch on bias, but Clarify's checks are typically point-in-time (before or after training), while Model Monitor's bias drift detection is the ongoing, post-deployment piece — the distinction this question is testing."},

{id:"ai3-05",src:"ai",domain:3,type:"single",
stem:"A company's internal knowledge-base articles change daily, and it wants its Bedrock chatbot's answers to reflect the latest version at all times. A vendor proposes periodically fine-tuning the model on the latest articles instead of using Knowledge Bases, arguing that fine-tuning will make the model 'truly know' the content rather than just look it up.\n\nWhat is the strongest reason Knowledge Bases (RAG) is the better approach here?",
choices:["Because the source articles change daily, fine-tuning would require constant, costly retraining to stay current; RAG retrieves the latest documents at query time with no retraining needed","Fine-tuning is technically impossible on frequently-changing data","RAG and fine-tuning produce identical results, so cost is the only difference","Knowledge Bases can only retrieve information that was part of the model's original pre-training data"],answer:0,
why:["Fine-tuning bakes information into the model's weights at a point in time — with daily-changing source articles, that would mean retraining constantly just to stay current, which is expensive and slow. RAG instead retrieves the current version of relevant documents at query time and injects them into the prompt, so answers reflect today's content without ever retraining the model.","Fine-tuning is technically possible on any dataset; the problem is practical — doing it constantly to keep up with daily changes is costly and slow, not impossible.","The two approaches behave differently: fine-tuning permanently changes the model's learned behavior until retrained, while RAG changes what information is available at query time without touching the model at all — they aren't equivalent, and cost is only one of several differences.","Knowledge Bases retrieves from whatever external data source you connect it to, such as a vector store of the knowledge-base articles — it isn't limited to the model's original pre-training data, which is the entire point of RAG."],
explain:"'Data that changes frequently' is the textbook trigger for RAG over fine-tuning — retraining a model every time source documents change is exactly the cost RAG is designed to avoid."},

{id:"ai3-06",src:"ai",domain:3,type:"single",
stem:"A travel-booking assistant needs to (1) look up whether a flight has open seats and (2) if seats are available, actually reserve one through the airline's internal reservation API, updating a live booking record. A teammate suggests Knowledge Bases for Amazon Bedrock is enough, since it can retrieve up-to-date flight information.\n\nWhy is Knowledge Bases NOT sufficient on its own here, and what's needed in addition?",
