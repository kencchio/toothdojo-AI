stem:"An online retailer's fraud check runs on every checkout, all day, with steady traffic of several hundred requests per second. Each check must return in well under 100ms.\n\nWhich SageMaker inference option fits best?",
choices:["Real-time inference","Serverless inference","Batch transform","Asynchronous inference"],answer:0,
why:["A persistent, always-on endpoint delivers the consistent low latency this steady, high-volume traffic needs.","Serverless inference scales down when idle and incurs cold-start latency when scaling back up, which risks missing a strict sub-100ms requirement.","Batch transform processes data offline in bulk; it can't respond to individual checkouts as they happen.","Asynchronous inference queues requests and returns results later — not suited to an immediate per-checkout response."],
explain:"Steady, high traffic with a strict low-latency requirement → real-time endpoint."},

{id:"ai1-11",src:"ai",domain:1,type:"single",
stem:"A media company's model analyzes uploaded videos up to 800MB in size, taking 5 to 45 minutes to process. Users are emailed when results are ready, and the endpoint should scale to zero when idle.\n\nWhich SageMaker inference option fits best?",
choices:["Asynchronous inference","Serverless inference","Real-time inference","Batch transform"],answer:0,
why:["Asynchronous inference supports large payloads (up to roughly 1GB) and long processing times (up to about an hour), and can scale to zero when idle — matching every requirement here.","Serverless inference caps payloads at roughly 4MB and timeouts at roughly 60 seconds, far too small for an 800MB, 45-minute job.","Real-time inference expects a quick synchronous response and doesn't scale to zero, which doesn't fit this workload.","Batch transform processes an already-available dataset as one offline job; it isn't designed for files arriving one at a time as users upload them."],
explain:"Large payload, long processing time, and scale-to-zero, but no need for an instant response, points to asynchronous inference."},

{id:"ai1-12",src:"ai",domain:1,type:"order",steps:6,
stem:"Select and order the phases of the machine learning development lifecycle. One item below is NOT a lifecycle phase. (Select and order SIX.)",
items:["Deploy the model","Collect, clean, and prepare the data","Monitor the model in production","Define the business goal and frame the ML problem","Evaluate the model against held-out data","Purchase Provisioned Throughput","Train and tune the model"],
answer:[3,1,6,4,0,2],
why:["Step 5. Put the approved model into a hosting environment for use.","Step 2. Gather, clean, label, and transform the data before training.","Step 6. Watch the deployed model for drift and quality issues, feeding back into retraining.","Step 1. Frame the problem and success metric before touching any data.","Step 4. Validate performance on data the model hasn't seen, before deploying.","A Bedrock capacity/pricing decision, not a stage of the general ML development lifecycle.","Step 3. Fit the model to the prepared data and tune its hyperparameters."],
explain:"Frame → Prepare data → Train → Evaluate → Deploy → Monitor is the loop; Provisioned Throughput is a real AWS action, but it isn't a lifecycle stage."},

{id:"ai1-13",src:"ai",domain:1,type:"single",
stem:"A manufacturing company has 200,000 unlabeled photos of circuit boards and needs bounding-box labels around defects, combining human labeling with active learning to reduce cost over time.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker Ground Truth","Amazon Mechanical Turk, used directly with no other tooling","Amazon Rekognition Custom Labels","Amazon SageMaker Autopilot"],answer:0,
why:["Ground Truth provides a managed labeling workflow with quality tooling and active learning, which auto-labels high-confidence images and sends only harder cases to humans.","Raw Mechanical Turk can label images, but without Ground Truth's workflow, quality tooling, and active learning, it doesn't reduce labeling effort over time.","Rekognition Custom Labels trains an image classifier from an already-labeled dataset; it doesn't provide a workflow for labeling a large unlabeled dataset.","Autopilot automates model building and tuning; it has no data-labeling capability."],
explain:"'Combine human labeling with ML / active learning to reduce labeling effort' → SageMaker Ground Truth."},

{id:"ai1-14",src:"ai",domain:1,type:"single",
stem:"A lender's document-extraction pipeline uses Amazon Textract in production. When extraction confidence for a field falls below 90% on a live application, the company wants that field routed to a human reviewer before the application proceeds.\n\nWhich AWS service should be used?",
choices:["Amazon Augmented AI (A2I)","Amazon SageMaker Ground Truth","Amazon SageMaker Model Monitor","Amazon Comprehend"],answer:0,
why:["A2I routes individual live predictions to human reviewers at inference time based on a condition like confidence, with no dataset-building or retraining involved.","Ground Truth is a labeling tool for building or expanding a training dataset — it doesn't intercept individual live predictions in production.","Model Monitor watches for drift in a deployed model's data and predictions over time; it doesn't route individual low-confidence predictions to a person.","Comprehend performs NLP analysis; it has no built-in human-review escalation workflow."],
explain:"Ground Truth labels data to build a training set; A2I reviews individual live predictions a deployed model is already making."},

{id:"ai1-15",src:"ai",domain:1,type:"single",
stem:"Two teams at a company each compute a customer's '30-day average spend' feature differently — one in a nightly batch job for training, another live in application code — causing inconsistent predictions between training and production.\n\nWhich AWS service directly addresses this?",
choices:["Amazon SageMaker Feature Store","Amazon S3","Amazon SageMaker Data Wrangler","AWS Glue"],answer:0,
why:["Feature Store provides an online store for low-latency serving and an offline store for training, both drawing from the same feature definitions, keeping training and inference consistent.","S3 can store computed features as files, but doesn't guarantee low-latency serving or prevent two teams from computing the same feature differently.","Data Wrangler cleans and transforms data before training; it doesn't manage feature consistency between training and live serving.","Glue is an ETL and data-preparation service; it doesn't provide a shared online/offline feature store."],
explain:"'Reuse features consistently across training and inference' is the trigger for SageMaker Feature Store."},

{id:"ai1-16",src:"ai",domain:1,type:"single",
stem:"A retailer's forecasting model was accurate at launch. Six months later, its error has grown steadily in production, and the team wants to detect this kind of change going forward.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker Model Monitor","Amazon SageMaker Clarify","Amazon SageMaker Debugger","Amazon SageMaker Autopilot"],answer:0,
why:["Model Monitor continuously compares live production data and predictions against a training baseline to detect drift over time.","Clarify detects bias and explains predictions, typically at specific points before or after training — not ongoing production monitoring.","Debugger monitors training jobs for issues like vanishing gradients; it plays no role after deployment.","Autopilot automates model building and tuning; it doesn't monitor a deployed model."],
explain:"'Model degraded over time in production' is the trigger for SageMaker Model Monitor."},

{id:"ai1-17",src:"ai",domain:1,type:"single",
stem:"After a major product redesign, a churn model's input customer-segment mix has shifted, AND the old relationship between login frequency and churn no longer holds.\n\nWhat is happening?",
choices:["Both data drift and concept drift","Concept drift only","Data drift only","Data leakage"],answer:0,
why:["The shifted segment mix is a change in the input distribution (data drift), and the broken login-frequency relationship is a change in what inputs mean for the outcome (concept drift). Both are described here.","The segment mix has also shifted, which is data drift — so it isn't concept drift alone.","The relationship between inputs and the outcome has also changed, which is concept drift — so it isn't data drift alone.","Data leakage is a training-time data-preparation flaw, not a real-world shift discovered after deployment."],
explain:"Data drift and concept drift often happen together after a real-world change like a product redesign."},

{id:"ai1-18",src:"ai",domain:1,type:"single",
stem:"A business analyst with no coding experience wants to build a churn-prediction model from a CSV file, entirely through a point-and-click interface, without writing any code.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker Canvas","Amazon SageMaker JumpStart","Amazon SageMaker Studio","AWS Glue DataBrew"],answer:0,
why:["Canvas gives non-technical users a no-code interface to import data, build a model, and get predictions.","JumpStart deploys and fine-tunes existing pre-trained models and solution templates — not quite the same as a guided, no-code custom-model workflow for tabular data.","Studio is an IDE for the ML lifecycle; it still involves notebooks and code.","DataBrew is a visual data-preparation tool; it doesn't build or train prediction models."],
explain:"'No code, build a model on my own data' is the trigger for SageMaker Canvas."},

{id:"ai1-19",src:"ai",domain:1,type:"multi",pick:2,
stem:"Which of the following are hyperparameters, set BEFORE training, rather than parameters the model learns from data? (Select TWO.)",
choices:["Learning rate","Neural network weights","Number of trees in a random forest","Word embedding vectors"],answer:[0,2],
why:["Set before training to control how quickly the optimizer updates weights — a hyperparameter.","Learned from data during training as the model minimizes its loss — a parameter, not a hyperparameter.","Set before training to control the size of the ensemble — a hyperparameter.","Learned from data during training — a parameter, even though it's a vector rather than a single number."],
explain:"Hyperparameters are chosen before training starts; parameters are learned from data during training."},

{id:"ai1-20",src:"ai",domain:1,type:"single",
stem:"A neural network trains for 200 epochs. Validation loss decreases until epoch 40, then slowly rises, while training loss keeps decreasing through epoch 200.\n\nWhich technique directly addresses this?",
choices:["Early stopping","Adding more regularization from the start","Increasing the learning rate","Collecting less training data"],answer:0,
why:["Early stopping halts training near where validation loss stops improving, before the model starts memorizing training noise.","More regularization can help prevent overfitting, but it doesn't directly address a training run already past its best point — stopping it is the direct fix.","A higher learning rate affects how training proceeds, not when to stop it.","Less training data generally makes overfitting worse, not better."],
explain:"Training loss falling while validation loss rises is the textbook trigger for early stopping."},

{id:"ai1-21",src:"ai",domain:1,type:"single",
stem:"A data scientist creates a new column, 'days_since_last_purchase,' from existing transaction dates. Separately, an image team creates extra training photos by rotating and recoloring existing ones.\n\nWhat are these two activities called, respectively?",
choices:["Feature engineering, then data augmentation","Data augmentation, then feature engineering","Feature engineering, for both","Data augmentation, for both"],answer:0,
why:["Deriving a new column from existing data is feature engineering; creating new training examples from existing ones is data augmentation.","This reverses the two definitions.","The image transformations create new rows, not a new column for existing rows, so the second activity isn't feature engineering.","The date-difference column doesn't create additional training examples, so the first activity isn't augmentation."],
explain:"Feature engineering changes what information exists about each example (columns). Data augmentation changes how many examples exist (rows)."},

{id:"ai1-22",src:"ai",domain:1,type:"single",
stem:"Before training, a data scientist studies distributions and correlations in a dataset without changing any of it. Afterward, based on what she found, she removes outliers and fills in missing values.\n\nWhat are these two phases called, respectively?",
choices:["Exploratory data analysis, then preprocessing","Preprocessing, then exploratory data analysis","Exploratory data analysis, for both","Preprocessing, for both"],answer:0,
why:["Investigating data without changing it is EDA; transforming it afterward (outlier removal, imputation) is preprocessing.","This reverses the two phases described.","The second phase changes the data, which makes it preprocessing, not further exploration.","The first phase doesn't change any data, which makes it EDA, not preprocessing."],
explain:"EDA (look, don't touch) typically comes before preprocessing (now change the data)."},

{id:"ai1-23",src:"ai",domain:1,type:"single",
stem:"A hotel chain wants to classify thousands of guest reviews as positive, negative, neutral, or mixed.\n\nWhich AWS service is the simplest fit for this narrow task?",
choices:["Amazon Comprehend","Amazon Bedrock with a custom prompt","Amazon SageMaker with a custom-trained classifier","Amazon Kendra"],answer:0,
why:["Comprehend's built-in sentiment analysis is a purpose-built API call for this exact task, with no prompt design or model selection required.","An LLM could do this, but it requires more setup — prompt design and output parsing — than a purpose-built API for a narrow, standard task.","Training a custom classifier is far more effort than a narrow task like sentiment analysis requires.","Kendra is a search service; it doesn't classify sentiment."],
explain:"When a narrow, well-defined NLP task already has a purpose-built AI service, that service usually beats a general-purpose approach."},

{id:"ai1-24",src:"ai",domain:1,type:"single",
stem:"A call center wants to transcribe customer calls and get native caller and agent sentiment scores from a single AWS capability.\n\nWhich AWS capability fits best?",
choices:["Amazon Transcribe Call Analytics","Amazon Transcribe (standard) plus Amazon Comprehend","Amazon Polly","Amazon Comprehend alone"],answer:0,
why:["Transcribe Call Analytics is purpose-built for contact centers and natively reports caller and agent sentiment alongside the transcript.","This combination works, but requires wiring two services together instead of using the single purpose-built capability.","Polly converts text to speech; it has no transcription or sentiment capability.","Comprehend analyzes text, not raw audio — it still needs a transcript first."],
explain:"Amazon Transcribe Call Analytics bundles transcription with call-level insights like sentiment in one capability."},

{id:"ai1-25",src:"ai",domain:1,type:"single",
stem:"A social media platform wants to automatically flag uploaded images that likely contain nudity or violence, with a confidence score per category.\n\nWhich Rekognition API should be used?",
choices:["DetectModerationLabels","DetectLabels","DetectFaces","DetectText"],answer:0,
why:["Purpose-built for content moderation, returning unsafe-content categories with confidence scores.","Detects general objects and scenes; it isn't scored or designed for content moderation.","Detects and analyzes faces; it doesn't flag unsafe content.","Extracts text from an image; it doesn't assess visual content safety."],
explain:"'Filter inappropriate/unsafe uploaded images' is the trigger for Rekognition's DetectModerationLabels."},

{id:"ai1-26",src:"ai",domain:1,type:"single",
stem:"A news website converts articles to narrated audio and now wants specific words emphasized and natural pauses inserted, without recording new audio manually.\n\nWhich AWS capability supports this?",
choices:["Amazon Polly","Amazon Transcribe","Amazon Comprehend","Amazon Lex"],answer:0,
why:["Polly supports SSML tags for controlling emphasis, pauses, and pronunciation in generated speech.","Transcribe converts speech to text; it plays no role in generating speech.","Comprehend can identify important phrases in text, but has no mechanism to control synthesized audio.","Lex manages conversational flow; it doesn't control fine-grained speech synthesis."],
explain:"Emphasis and pauses on top of basic text-to-speech point to Polly's SSML support."},

{id:"ai1-27",src:"ai",domain:1,type:"single",
stem:"An online retailer wants real-time, per-user product recommendations, including sensible suggestions for brand-new users with no history yet.\n\nWhich AWS service should be used?",
choices:["Amazon Personalize","Amazon Forecast","Amazon Kendra","Amazon Comprehend"],answer:0,
why:["Personalize generates real-time, personalized recommendations and includes recipes for common scenarios like limited-history users.","Forecast predicts future numeric values over time, a different problem from ranking items for a user.","Kendra retrieves relevant documents for a search query; it doesn't generate personalized recommendations.","Comprehend analyzes text; it doesn't produce ranked recommendations."],
explain:"'Real-time, per-user recommendations, minimal custom ML work' is Personalize's core purpose."},

{id:"ai1-28",src:"ai",domain:1,type:"single",
stem:"A clinic wants a bot that recognizes an appointment-booking intent, collects date, time, and doctor's name through conversation, and integrates natively with Amazon Connect.\n\nWhich AWS service should be used?",
choices:["Amazon Lex","Agents for Amazon Bedrock","Amazon Comprehend","Amazon Polly"],answer:0,
why:["Lex's intents and slots map directly onto recognizing an appointment intent and collecting date, time, and doctor, with native Amazon Connect integration.","Bedrock Agents can also hold multi-step conversations, but Lex's purpose-built slot-filling model and mature Connect integration fit this structured task more directly.","Comprehend analyzes text; it doesn't manage conversation flow.","Polly only converts text to speech; it doesn't manage conversation or collect information."],
explain:"Intents, slots, and native Amazon Connect integration are Lex's defining features for structured conversational tasks."},

{id:"ai1-29",src:"ai",domain:1,type:"single",
stem:"A global support team receives messages in many unknown languages and wants each one automatically identified and translated into English in real time.\n\nWhich AWS service should be used?",
choices:["Amazon Translate","Amazon Comprehend","Amazon Transcribe","Amazon Lex"],answer:0,
why:["Translate can automatically detect the source language and translate to the target language in the same call.","Comprehend can detect a text's dominant language, but doesn't translate it.","Transcribe converts speech to text; the scenario is about text messages, not audio.","Lex manages conversational flow; it isn't a translation service."],
explain:"Amazon Translate auto-detects the source language as part of translation, avoiding a separate detection step."},

{id:"ai1-30",src:"ai",domain:1,type:"match",
stem:"Match each scenario to the type of machine learning being described. One scenario is easy to mislabel. (Select FOUR.)",
prompts:["A team has 500 labeled photos of a rare defect and 50,000 unlabeled photos from the same production line","A streaming service groups viewers into behavioral segments with no predefined categories","A model predicts loan default using thousands of past applications with known outcomes","A trading bot adjusts its strategy based on profit-and-loss feedback from each trade"],
options:["Supervised learning","Unsupervised learning","Reinforcement learning","Semi-supervised learning"],answer:[3,1,0,2],
why:["Learns from labeled examples with a known correct output, such as past loan outcomes.","Finds structure in unlabeled data, such as grouping viewers with no predefined categories.","An agent learns by taking actions and receiving reward-like feedback, such as profit and loss.","Combines a small labeled set with a much larger unlabeled set — the defining trigger for the defect-detection scenario."],
explain:"The defect-detection scenario does have some labels, which makes 'supervised' tempting, but a small labeled set plus a much larger unlabeled set is the specific trigger for semi-supervised learning."},

{id:"ai1-31",src:"ai",domain:1,type:"single",
stem:"A subscription company wants to predict, for each customer, which ONE of four outcomes will happen next month: stays, downgrades, upgrades, or cancels.\n\nWhat type of ML problem is this?",
choices:["Multi-class classification","Binary classification","Regression","Clustering"],answer:0,
why:["Predicting one of several mutually exclusive categories is multi-class classification.","Binary classification predicts one of exactly two categories; here there are four.","The outcomes are categories, not numeric values, so this isn't regression.","The categories are already known and labeled, not discovered from unlabeled data, which rules out clustering."],
explain:"More than two known, labeled categories shifts a problem from binary to multi-class classification."},

{id:"ai1-32",src:"ai",domain:1,type:"single",
stem:"On an imbalanced fraud dataset (0.5% fraud), Model A has 99.5% accuracy and an AUC of 0.62. Model B has 97% accuracy and an AUC of 0.91.\n\nWhich model actually separates fraud from non-fraud better?",
choices:["Model B","Model A","Both are equally good","Cannot be determined from this information"],answer:0,
why:["AUC measures how well a model ranks true fraud above legitimate transactions across all thresholds, and Model B's AUC is far higher.","Model A's high accuracy mostly reflects that predicting 'not fraud' for almost everyone is already correct 99.5% of the time on this imbalanced data — it says little about actual fraud detection.","AUC and accuracy disagree sharply here, so the two models are not equally good at the underlying task.","AUC directly answers this question — it's a clear, comparable measure of ranking ability between the two classes."],
explain:"On imbalanced data, accuracy can look great while a model barely detects the minority class. AUC is more informative because it's independent of class balance."},

{id:"ai1-33",src:"ai",domain:1,type:"single",
stem:"A team tunes hyperparameters using the validation set. Later, unsatisfied with the results, they also try a few settings directly against the test set and report whichever one scores highest there.\n\nWhat problem does this final step create?",
choices:["The reported test score becomes an optimistic, biased estimate","Nothing, since the validation set was already used correctly","The validation set should not have been created in the first place","No problem, as long as validation is repeated afterward"],answer:0,
why:["The test set's purpose is one honest, final estimate on unseen data. Using it to choose among settings means those choices are now fit to the test set, biasing the reported score.","The earlier validation-set tuning was fine, but that doesn't excuse reusing the test set afterward for selection.","A validation set is a standard, appropriate part of the process — the problem is reusing the test set, not having a validation set.","Re-checking against validation afterward doesn't undo the leakage that already happened when the test set influenced the choice."],
explain:"The test set stops being a fair, unseen benchmark the moment it's used, even briefly, to choose between candidate settings."},

{id:"ai1-34",src:"ai",domain:1,type:"single",
stem:"A fraud model performs very well in development. A data scientist later notices a training feature, 'dispute_opened_flag,' is only set after a customer disputes a charge — information that wouldn't exist yet when a transaction is scored for fraud in real time.\n\nWhat problem does this cause?",
choices:["Target/data leakage","Underfitting","Concept drift","Class imbalance"],answer:0,
why:["A feature only populated after the outcome is known lets the model 'peek' at information tied to the answer, inflating offline results in a way that won't hold up at real prediction time.","A leaking feature typically makes a model look artificially good, not underpowered.","This describes a flaw in the training data itself, not a change in real-world behavior over time.","Class imbalance concerns the frequency of outcomes, not whether a feature is available at prediction time."],
explain:"Leakage isn't always obvious — look for any feature that could only be known after the event being predicted has already happened."},

{id:"ai1-35",src:"ai",domain:1,type:"single",
stem:"A logistics company wants to automatically calculate customs duty using a government tariff formula that takes exact inputs and must match the government's calculation exactly, with full auditability. Plenty of historical shipment data is available.\n\nIs machine learning appropriate here?",
choices:["No, a deterministic rule should be used instead","Yes, since plenty of historical data is available","Yes, but only with a decision tree for interpretability","No, because there isn't enough data"],answer:0,
why:["Even with abundant data, a trained model is a statistical approximation and can't guarantee it exactly reproduces a fully known formula on every input, which fails the zero-deviation, fully-auditable requirement.","Data availability isn't the limiting factor — the issue is that a statistical model can't guarantee exact reproduction of a known formula.","A decision tree is more interpretable than some models, but it's still an approximation, not a guaranteed exact match to the formula.","The scenario states plenty of data is available, so lack of data isn't the reason ML is a poor fit here."],
explain:"When exact logic is already fully known and must be reproduced with zero deviation, deterministic code beats a trained model regardless of how much data exists."},

{id:"ai1-36",src:"ai",domain:1,type:"single",
stem:"An ML team's workflow — data processing, training, evaluation, and conditional model registration — is currently run manually and inconsistently. They want it automated as a repeatable workflow within SageMaker.\n\nWhich AWS service should be used?",
choices:["SageMaker Pipelines","SageMaker Clarify","SageMaker Ground Truth","SageMaker Debugger"],answer:0,
why:["Pipelines defines and orchestrates a repeatable, automated ML workflow as a series of connected steps within SageMaker.","Clarify detects bias and explains predictions; it doesn't orchestrate workflows.","Ground Truth only handles data labeling, not the full multi-step workflow described.","Debugger monitors training jobs; it doesn't orchestrate a broader workflow."],
explain:"Automating a repeatable ML workflow within SageMaker's own tooling is Pipelines' purpose."},

{id:"ai1-37",src:"ai",domain:1,type:"single",
stem:"A governance policy requires every model version to be cataloged with its training metrics, and to pass an approval step before deployment.\n\nWhich AWS service should be used?",
choices:["SageMaker Model Registry","Amazon ECR","SageMaker Feature Store","AWS CloudTrail"],answer:0,
why:["Model Registry catalogs model versions, stores metadata such as training metrics, and manages approval status before deployment.","ECR versions container images; it doesn't track model-specific metadata or manage an approval workflow.","Feature Store manages ML features, not model artifacts or approval status.","CloudTrail logs API calls; it doesn't track whether a model version was reviewed and approved."],
explain:"'Manage model versions / approval before production' is the trigger for SageMaker Model Registry."},

{id:"ai1-38",src:"ai",domain:1,type:"single",
stem:"A factory has 500,000 labeled photos of products marked defective or not defective, and wants to automatically classify new photos with high accuracy.\n\nWhich approach is most appropriate?",
choices:["A deep learning model trained on the raw images","A Support Vector Machine on hand-crafted pixel features","Linear regression on pixel averages","K-means clustering on the images"],answer:0,
why:["With a large labeled image dataset, deep learning can learn relevant visual features directly from raw pixels, often outperforming hand-crafted features.","Hand-crafted pixel features can miss the patterns that actually distinguish defects, limiting an SVM's accuracy on complex image data.","Linear regression predicts continuous values and isn't suited to image classification.","Clustering is unsupervised and ignores the labels that are already available."],
explain:"Unstructured, high-volume image data with plenty of labels is deep learning's strength."},

{id:"ai1-39",src:"ai",domain:1,type:"single",
stem:"A company's new recommendation model improved precision@10 from 0.31 to 0.38. Leadership wants to know if it's actually driving more revenue.\n\nWhat should the team do to measure this?",
choices:["Run a controlled A/B test comparing revenue per user","Report the improved precision@10 as sufficient evidence","Report the model's training loss instead","Assume revenue improved proportionally to precision"],answer:0,
why:["An A/B test comparing a business outcome like revenue per user between the old and new model directly isolates the model's actual business impact.","Precision@10 is a model-quality metric; it doesn't by itself prove customers bought more or spent more.","Training loss is even further removed from business outcomes than precision@10.","There's no guaranteed proportional link between a model-quality metric and revenue — it has to be measured directly."],
explain:"Business impact requires measuring a business outcome directly, ideally through a controlled experiment like an A/B test."},

{id:"ai1-40",src:"ai",domain:1,type:"single",
stem:"A startup wants to deploy an open-source computer-vision model, later fine-tune it on its own data, and needs to choose the specific GPU instance type it runs on.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker JumpStart","Amazon Bedrock","Amazon Rekognition Custom Labels","Amazon Comprehend"],answer:0,
why:["JumpStart deploys pre-trained open-source models onto SageMaker infrastructure where the instance type is chosen by the user, and supports later fine-tuning.","Bedrock is a fully managed, serverless API that doesn't expose the underlying compute instance a model runs on.","Rekognition Custom Labels trains an image classifier from labeled data; it doesn't deploy general open-source models with instance-level control.","Comprehend is a text-analysis service, unrelated to deploying a computer-vision model."],
explain:"Controlling the specific instance type a pre-trained model runs on points to SageMaker JumpStart, not Bedrock."},

{id:"ai1-41",src:"ai",domain:1,type:"single",
stem:"A medical imaging company has 1,000 labeled scans and 100,000 unlabeled scans from the same equipment, and labeling more requires expensive specialist time.\n\nWhich approach makes the best use of ALL this data?",
choices:["Semi-supervised learning","Supervised learning on the 1,000 labeled scans only","Unsupervised learning on all scans","Reinforcement learning"],answer:0,
why:["Semi-supervised learning combines the small labeled set with the much larger unlabeled set, making use of both.","Using only the labeled scans ignores the 100,000 unlabeled scans entirely.","Unsupervised learning would ignore the valuable labels that already exist.","Reinforcement learning requires an environment with actions and rewards, not a fixed dataset of scans."],
explain:"'Limited labeled data, lots of unlabeled data' is the trigger phrase for semi-supervised learning."},

{id:"ai1-42",src:"ai",domain:1,type:"single",
stem:"An operations team wants to detect unusual spikes in server metrics in near real time. Historical data has no labels marking past anomalies, and new anomaly types may appear that were never seen before.\n\nWhich approach fits best?",
choices:["Random Cut Forest","An XGBoost classifier trained to predict anomalies","Linear regression on the metrics","K-nearest neighbors using labeled anomaly examples"],answer:0,
why:["Random Cut Forest is unsupervised — it learns what 'normal' looks like and scores deviation, without needing labeled anomalies, and can flag novel patterns.","XGBoost is supervised and needs labeled examples of actual anomalies to train on, which don't exist here.","Linear regression predicts a continuous value; it isn't built for anomaly scoring.","This approach requires labeled anomaly examples, which the scenario says don't exist."],
explain:"No labeled anomalies, plus the chance of unseen anomaly types, favors an unsupervised approach like Random Cut Forest."},

// ---------- AI-generated: Domain 3 (Applications of Foundation Models) ----------
{id:"ai3-01",src:"ai",domain:3,type:"single",
stem:"A startup needs to call Claude, Titan, Llama, and Mistral through a single API, with zero servers or GPU instances to manage.\n\nWhich AWS service should be used?",
choices:["Amazon Bedrock","Amazon SageMaker JumpStart","Amazon Comprehend","Amazon Kendra"],answer:0,
why:["Bedrock provides access to multiple FM providers through one managed API with no infrastructure to run.","JumpStart deploys models onto SageMaker infrastructure that the user configures and pays for, even when idle — not zero infrastructure.","Comprehend is a narrow, pre-trained NLP service, not a foundation-model platform.","Kendra is an enterprise search service; it doesn't provide access to foundation models."],
explain:"'Access an FM quickly, no infrastructure' is the trigger for Bedrock over SageMaker."},

{id:"ai3-02",src:"ai",domain:3,type:"single",
stem:"A team has a large labeled dataset and wants to train a custom gradient-boosted tree model, writing their own feature engineering and training code, with full control over the algorithm and infrastructure.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker","Amazon Bedrock fine-tuning","Amazon Comprehend","Amazon Personalize"],answer:0,
why:["SageMaker covers the full ML lifecycle, including custom algorithms like gradient boosting, custom training code, and full infrastructure control.","Bedrock fine-tuning customizes an existing foundation model within limits the provider allows — it isn't a blank-slate custom training environment for a different algorithm.","Comprehend is a pre-trained NLP service, not a custom-model training platform.","Personalize is a managed recommendation service, not a general custom-model trainer."],
explain:"'Own labeled data, custom algorithm, full lifecycle control' is the SageMaker trigger."},

{id:"ai3-03",src:"ai",domain:3,type:"match",
stem:"Match each situation to the SageMaker capability that addresses it. (Select THREE.)",
prompts:["A column meant to average about 50 actually contains invalid values like -1 and 999, and the team wants a visual way to spot and fix this before training","Labeling would take one engineer several months by hand, so the team wants a model to gradually take over labeling easy cases while people handle the hard ones","Two teams keep computing the same customer feature slightly differently, causing mismatches between training and live serving"],
options:["SageMaker Data Wrangler","SageMaker Ground Truth","SageMaker Feature Store","SageMaker Autopilot","SageMaker Model Monitor"],answer:[0,1,2],
why:["Data Wrangler gives a visual interface for spotting and fixing data-quality issues, such as invalid values, before training.","Ground Truth combines human labeling with active learning, letting a model gradually take over confidently-labeled cases.","Feature Store's shared online and offline stores keep a feature consistent between training and serving.","Autopilot automates model selection and tuning; it doesn't address data cleaning, labeling, or feature consistency.","Model Monitor watches a deployed model for drift; it doesn't address issues before or during training."],
explain:"Each SageMaker tool maps to a specific pain point: messy values → Data Wrangler, expensive manual labeling → Ground Truth, training/serving feature mismatches → Feature Store."},

{id:"ai3-04",src:"ai",domain:3,type:"single",
stem:"A deployed loan-approval model's overall accuracy hasn't changed in six months, but the team suspects the error rate for one demographic subgroup may be drifting away from others, and wants this tracked continuously going forward.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker Model Monitor","Amazon SageMaker Clarify","Amazon SageMaker Autopilot","AWS CloudTrail"],answer:0,
why:["Model Monitor's drift detection includes bias drift as one of its ongoing, post-deployment monitoring dimensions.","Clarify detects bias, but typically at specific points before or after training, rather than as continuous ongoing monitoring.","Autopilot automates model building; it doesn't monitor deployed models.","CloudTrail logs API calls; it doesn't evaluate model fairness or drift."],
explain:"Clarify's bias checks are typically point-in-time; Model Monitor's bias drift detection is the ongoing, post-deployment piece."},

{id:"ai3-05",src:"ai",domain:3,type:"single",
stem:"A company's internal knowledge-base articles change daily, and it wants its Bedrock chatbot's answers to reflect the latest version at all times, without retraining any model.\n\nWhich Bedrock feature should be used?",
choices:["Knowledge Bases","Fine-tuning","Continued pre-training","Provisioned Throughput"],answer:0,
why:["Knowledge Bases retrieves the current version of relevant documents at query time and injects them into the prompt, with no retraining needed.","Fine-tuning bakes information into model weights at a point in time — daily-changing source data would require constant, costly retraining.","Continued pre-training also modifies model weights using a large batch of data; it isn't meant for daily updates either.","Provisioned Throughput is a capacity and pricing option, unrelated to keeping answers current."],
explain:"'Data that changes frequently' is the textbook trigger for RAG (Knowledge Bases) over fine-tuning."},

{id:"ai3-06",src:"ai",domain:3,type:"single",
stem:"A travel-booking assistant needs to check flight availability and actually reserve a seat by calling the airline's internal reservation API during the conversation.\n\nWhich Bedrock feature should be used?",
choices:["Agents for Amazon Bedrock","Knowledge Bases for Amazon Bedrock","Guardrails for Amazon Bedrock","Model Evaluation"],answer:0,
why:["Agents let a foundation model take multi-step actions, calling APIs or Lambda functions to complete a task like making a reservation.","Knowledge Bases retrieves and injects existing information into a prompt; it has no mechanism to call an API and change state.","Guardrails control what a model is allowed to say; they don't execute external actions.","Model Evaluation benchmarks models offline; it isn't involved in taking live actions."],
explain:"'The model needs to call APIs / take actions' is the trigger for Agents for Amazon Bedrock."},

{id:"ai3-07",src:"ai",domain:3,type:"single",
stem:"A company wants its Bedrock-based support bot to never discuss competitor pricing, and to automatically redact any credit card numbers a customer types into the chat.\n\nWhich Bedrock feature should be used?",
choices:["Guardrails for Amazon Bedrock","Knowledge Bases","Model Evaluation","Agents for Amazon Bedrock"],answer:0,
why:["Guardrails supports denied topics and PII redaction as configurable, runtime content-filtering policies.","Knowledge Bases retrieves documents for grounding; it doesn't filter or redact content.","Model Evaluation compares model quality offline; it doesn't filter live output.","Agents orchestrate multi-step actions; they don't provide content filtering."],
explain:"'Prevent the model from discussing X' and 'redact PII from responses' are both textbook Guardrails triggers."},

{id:"ai3-08",src:"ai",domain:3,type:"single",
stem:"A company fine-tuned a Titan model in Amazon Bedrock and wants to run a short, low-cost evaluation of it before committing to a longer-term throughput purchase.\n\nWhat should the company do?",
choices:["Purchase Provisioned Throughput on a no-commitment, hourly basis","Run the fine-tuned model on-demand with no Provisioned Throughput","Commit to a six-month Provisioned Throughput term first","Start a brand-new fine-tuning job to evaluate quality"],answer:0,
why:["Custom models in Bedrock require Provisioned Throughput to run, but a no-commitment, hourly option exists specifically for evaluating a custom model before a longer commitment.","Fine-tuned custom models in Bedrock require Provisioned Throughput before they can serve inference at all.","A long-term commitment isn't required just to evaluate the model, since an hourly, no-commitment option exists.","The model is already fine-tuned; evaluating it doesn't require starting a new fine-tuning job."],
explain:"Custom models need Provisioned Throughput to run, but it can be purchased hourly with no long-term commitment for initial evaluation."},

{id:"ai3-09",src:"ai",domain:3,type:"single",
stem:"A company already fine-tuned an open-weights model outside of AWS, using its own GPU cluster, and wants to serve that exact model through Bedrock's managed API.\n\nWhich Bedrock feature should be used?",
choices:["Custom Model Import","Fine-tuning in Bedrock on the same data","Continued pre-training","Knowledge Bases"],answer:0,
why:["Custom Model Import brings an already-trained model artifact directly into Bedrock to serve as-is.","Re-running fine-tuning doesn't guarantee an identical model and unnecessarily repeats work already done outside AWS.","Continued pre-training adapts a model using unlabeled data; it doesn't import an already-finished model.","Knowledge Bases provides retrieval for grounding responses; it doesn't host or import a model."],
explain:"When a model already exists and was trained elsewhere, Custom Model Import serves it directly."},

{id:"ai3-10",src:"ai",domain:3,type:"single",
stem:"A team wants to quickly narrow five candidate Bedrock models down to two using benchmark metrics, then have their own reviewers judge tone and helpfulness on the finalists.\n\nWhich Bedrock capability supports BOTH stages?",
choices:["Model Evaluation","Guardrails","Agents for Amazon Bedrock","Knowledge Bases"],answer:0,
why:["Bedrock Model Evaluation supports both automatic (benchmark-metric) jobs for a fast first pass, and human-based jobs for nuanced review on a shortlist.","Guardrails controls model output; it doesn't compare or evaluate models.","Agents orchestrate actions; they aren't part of model evaluation.","Knowledge Bases handles retrieval for grounding; it isn't an evaluation capability."],
explain:"Bedrock Model Evaluation offers both automatic and human-based job types, suited to exactly this two-stage funnel."},

{id:"ai3-11",src:"ai",domain:3,type:"single",
stem:"A design team generates marketing images with Amazon Titan Image Generator. Months later, they need to verify that a specific image circulating online came from their account's generations.\n\nWhich built-in capability supports this?",
choices:["Titan Image Generator's default invisible watermark","Guardrails' contextual grounding check","SageMaker Model Cards","Rekognition content moderation labels"],answer:0,
why:["Titan Image Generator embeds an invisible watermark by default in every image it creates, supporting later verification of AI-generated origin.","Contextual grounding check evaluates whether a text response is supported by source content; it has nothing to do with image provenance.","Model Cards document a model's intended use and limitations; they don't mark individual outputs.","Rekognition's moderation labels flag unsafe content; they don't detect AI-generated origin."],
explain:"Content-provenance questions about Titan-generated images point to its default invisible watermarking."},

{id:"ai3-12",src:"ai",domain:3,type:"single",
stem:"A company already uses Amazon Kendra to search its internal wikis. Employees now want a synthesized, conversational answer to their questions instead of a list of matching documents.\n\nWhich AWS service adds this?",
choices:["Amazon Q Business","Amazon Kendra alone","Amazon Comprehend","Amazon Lex"],answer:0,
why:["Q Business is a generative assistant that synthesizes a direct, conversational answer grounded in enterprise data, often using a retriever like Kendra underneath.","Kendra returns a ranked list of relevant documents; it isn't itself a generative conversational assistant.","Comprehend performs text analysis, not conversational answer generation.","Lex builds conversational interfaces, but isn't built to synthesize answers grounded in enterprise document search the way Q Business is."],
explain:"Kendra retrieves documents; Q Business synthesizes a conversational answer from what's retrieved."},

{id:"ai3-13",src:"ai",domain:3,type:"single",
stem:"A software team wants in-IDE code suggestions, automated security-vulnerability scanning, and help upgrading a legacy Java application to a newer version.\n\nWhich AWS service should be used?",
choices:["Amazon Q Developer","Amazon Q Business","Amazon Kendra","Amazon Comprehend"],answer:0,
why:["Q Developer (formerly CodeWhisperer) provides code suggestions, security scanning, and code transformation such as Java version upgrades.","Q Business answers questions from internal company documents for business users, not a coding assistant.","Kendra is an enterprise search service, not a coding assistant.","Comprehend is a text-analysis service, not a coding assistant."],
explain:"Code suggestions, security scanning, and Java version upgrades are the trigger phrases for Amazon Q Developer."},

{id:"ai3-14",src:"ai",domain:3,type:"single",
stem:"A company building a RAG architecture wants built-in connectors to enterprise systems like SharePoint, plus relevance tuning, without building its own embedding and indexing pipeline.\n\nWhich service is the better retriever for this?",
choices:["Amazon Kendra","Amazon OpenSearch Service with k-NN","Amazon Neptune ML","Amazon DocumentDB"],answer:0,
why:["Kendra is an intelligent enterprise search service with built-in connectors to common enterprise data sources and relevance-tuning features.","OpenSearch with k-NN is a flexible vector search engine, but requires building and maintaining an embedding and indexing pipeline yourself.","Neptune ML is built around graph data and Graph Neural Networks, not general enterprise document connectors.","DocumentDB supports vector search, but doesn't provide the same built-in enterprise connectors as Kendra."],
explain:"Kendra's built-in connectors and relevance tuning mean less custom pipeline work than a raw vector store."},

{id:"ai3-15",src:"ai",domain:3,type:"single",
stem:"A company wants to reduce the cost of training a new large model from scratch, using AWS's custom silicon.\n\nWhich chip should be used for this workload?",
choices:["AWS Trainium","AWS Inferentia","A general-purpose CPU instance","AWS Graviton"],answer:0,
why:["Trainium is purpose-built to reduce the cost of training large models.","Inferentia is purpose-built for inference cost, not training.","General-purpose CPUs are not optimized for large-scale model training the way Trainium is.","Graviton is a general-purpose ARM-based CPU for broad workloads, not a specialized ML training chip."],
explain:"Trainium = training cost optimization. Inferentia = inference cost optimization."},

{id:"ai3-16",src:"ai",domain:3,type:"match",
stem:"Match each evaluation concept to what it measures. Two options are classification metrics that don't belong to any of the four descriptions. (Select FOUR.)",
prompts:["Overlap of n-grams between generated and reference text, commonly used for machine translation","How confidently a language model predicts the next token in a sequence","Semantic similarity between generated and reference text using embeddings","Overlap of n-grams and sequences between generated and reference text, commonly used for summarization"],
options:["BLEU","Perplexity","BERTScore","ROUGE","F1 score","Accuracy"],answer:[0,1,2,3],
why:["N-gram precision overlap, the standard metric for translation quality.","Measures how confidently a model predicts the next token — a fluency measure, not correctness.","Uses embeddings to compare semantic similarity, useful when wording differs but meaning matches.","N-gram and sequence recall overlap, the standard metric for summarization quality.","The harmonic mean of precision and recall for classification tasks, not a text-generation metric.","The overall correct-prediction rate for classification tasks, also not a text-generation metric."],
explain:"BLEU (translation) and ROUGE (summarization) measure surface n-gram overlap. Perplexity measures fluency. BERTScore captures meaning via embeddings. F1 and accuracy belong to classification, a different metric family entirely."},

{id:"ai3-17",src:"ai",domain:3,type:"match",
stem:"A team is evaluating the quality of a RAG (Retrieval-Augmented Generation) system. Match each quality concept to what it checks. (Select THREE.)",
prompts:["Does retrieval fetch information from the right documents?","Does the generated answer stick to the retrieved context instead of making things up?","Does the generated answer actually address the user's original question?"],
options:["Context relevance","Faithfulness","Answer relevance","Perplexity","Recall"],answer:[0,1,2],
why:["Checks whether retrieval fetched the right documents for the query.","Checks whether the generated answer sticks to the retrieved context rather than hallucinating.","Checks whether the final answer actually addresses the user's question.","A general fluency measure; it doesn't evaluate retrieval quality or grounding.","A classification metric for catching positives; it doesn't evaluate retrieval, grounding, or answer usefulness."],
explain:"Faithfulness, context relevance, and answer relevance cover grounding, retrieval quality, and answer usefulness as three separate checks."},

{id:"ai3-18",src:"ai",domain:3,type:"order",steps:4,
stem:"Rank the following Amazon Bedrock model customization approaches from the one that changes the model LEAST to the one that changes it MOST. One listed item is not a customization approach. (Select and order FOUR.)",
items:["Prompt engineering","RAG using Knowledge Bases","Fine-tuning","Continued pre-training","Purchasing Provisioned Throughput"],
answer:[0,1,2,3],
why:["Step 1, least change. Only the input prompt changes; model weights are untouched.","Step 2. Grounds responses in retrieved data at query time; weights are still untouched.","Step 3. Updates model weights using labeled data to change style or behavior.","Step 4, most change. Adapts base knowledge using a large amount of unlabeled domain data.","A capacity and pricing decision needed to serve a customized model — not itself a customization method."],
explain:"Bedrock's customization ladder: prompt engineering → RAG → fine-tuning → continued pre-training."},

{id:"ai3-19",src:"ai",domain:3,type:"single",
stem:"A company hosts 200 lightweight ML models. Each is called occasionally and unpredictably, and requests need a quick synchronous response. Running 200 always-on endpoints would be costly and mostly idle.\n\nWhich SageMaker deployment option fits best?",
choices:["Multi-model endpoint","Asynchronous inference","Batch transform","One real-time endpoint per model"],answer:0,
why:["A multi-model endpoint hosts many models behind one real-time endpoint, sharing infrastructure cost while keeping quick, synchronous responses.","Asynchronous inference queues requests and returns results later, which doesn't match a need for a quick synchronous response.","Batch transform processes a known dataset offline in bulk; it doesn't serve on-demand individual requests.","Running a separate always-on endpoint per model wastes capacity when each model's traffic is low."],
explain:"Many models with low individual traffic, needing a quick synchronous response, is the trigger for a multi-model endpoint."},

{id:"ai3-20",src:"ai",domain:3,type:"single",
stem:"A compliance team wants a document per model version explaining its intended use, limitations, training data, and risk considerations, for external auditors.\n\nWhich AWS service should be used?",
choices:["SageMaker Model Cards","SageMaker Model Registry","Amazon ECR","AWS Glue"],answer:0,
why:["Model Cards are purpose-built to document a model's intended use, limitations, training data, and risk considerations.","Model Registry tracks versions, metadata, and approval status, but not this kind of narrative documentation.","ECR stores container images; it doesn't document a model's intended use or limitations.","Glue is a data-preparation and ETL service, unrelated to model documentation."],
explain:"'Document model for governance/audit' is the trigger for SageMaker Model Cards."},

{id:"ai3-21",src:"ai",domain:3,type:"single",
stem:"A company wants to deploy an open-source Llama model not available in Bedrock, on a specific GPU instance type it has already benchmarked. It has not trained or fine-tuned this model itself.\n\nWhich AWS service should be used?",
choices:["Amazon SageMaker JumpStart","Custom Model Import","Amazon Bedrock","Amazon Q Developer"],answer:0,
why:["JumpStart hosts a wide range of pre-trained open-source models, deployable onto SageMaker instances the user chooses.","Custom Model Import is for bringing in a model already trained or fine-tuned elsewhere — this team hasn't trained anything.","Bedrock offers only a curated set of models from AWS and its partners, which doesn't include every open-source model.","Q Developer is a coding assistant, unrelated to hosting foundation models."],
explain:"Deploying an existing pre-trained model with instance-level control, when it isn't in Bedrock's catalog, points to SageMaker JumpStart."},

{id:"ai3-22",src:"ai",domain:3,type:"single",
stem:"A team currently calls Bedrock's InvokeModel API separately for Claude, Titan, and Llama, writing different parsing logic for each provider's format. They want one consistent request and response structure across all providers, with streaming support.\n\nWhich Bedrock API should be used?",
choices:["Converse API","InvokeModel","Batch inference","Custom Model Import"],answer:0,
why:["Converse and its streaming counterpart, ConverseStream, standardize the conversation format across Bedrock's model providers and support streamed responses.","InvokeModel is the older API where request and response formats can differ by provider — the inconsistency the team wants to avoid.","Batch inference runs large jobs asynchronously and non-interactively, not suited to live streaming.","Custom Model Import changes how a model is hosted, not the API's request and response format."],
explain:"Converse/ConverseStream is AWS's unified API across providers, with native streaming support."}
];

</script>
<script>
(function(){
const DOMAINS={1:"Fundamentals of AI and ML",2:"Fundamentals of Generative AI",3:"Applications of Foundation Models",4:"Guidelines for Responsible AI",5:"Security, Compliance, and Governance"};
const ALL=[...TD_QUESTIONS,...AI_QUESTIONS];
const BY_ID=Object.fromEntries(ALL.map(q=>[q.id,q]));
const KEY="aif-drill-v1";
const LETTERS="ABCDEFGH";

let store={answers:{},src:"all",domain:"all",missedOnly:false,shuffle:false,shuffleQ:false,qOrder:null,current:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

const draft={}; // unsubmitted selections per question id
const orderCache={}; // shuffled display order per question
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function paras(s){return s.split(/\n\n+/).map(p=>"<p>"+esc(p)+"</p>").join("");}
function shuffled(n,seed){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function displayOrder(q,n){
  if(!store.shuffle) return [...Array(n).keys()];
  if(!orderCache[q.id]) orderCache[q.id]=shuffled(n);
  return orderCache[q.id];
}
function shuffledIds(){
  const ids=ALL.map(q=>q.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return ids;
}
function baseList(){
  if(store.shuffleQ&&Array.isArray(store.qOrder)&&store.qOrder.length===ALL.length){
    return store.qOrder.map(id=>BY_ID[id]).filter(Boolean);
  }
  return ALL;
}

function filtered(){
  return baseList().filter(q=>(store.src==="all"||q.src===store.src)
    &&(store.domain==="all"||String(q.domain)===store.domain)
    &&(!store.missedOnly||(store.answers[q.id]&&!store.answers[q.id].correct)));
}

function grade(q,resp){
  if(q.type==="single") return {correct:resp===q.answer,got:resp===q.answer?1:0,total:1};
  if(q.type==="multi"){const a=[...q.answer].sort().join(),r=[...resp].sort().join();return {correct:a===r,got:resp.filter(x=>q.answer.includes(x)).length,total:q.answer.length};}
  if(q.type==="match"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
  if(q.type==="order"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
}

function renderStats(){
  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  let a=0,ok=0;pool.forEach(q=>{const r=store.answers[q.id];if(r){a++;if(r.correct)ok++;}});
  sAns.textContent=a;sOk.textContent=ok;sMiss.textContent=a-ok;sAcc.textContent=a?Math.round(ok/a*100)+"%":"–";
  subline.textContent=pool.length+" review questions with explanations for every choice.";
}

function renderControls(){
  document.querySelectorAll("#srcSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.src===store.src));
  cAll.textContent=ALL.length;cTd.textContent=TD_QUESTIONS.length;cAi.textContent=AI_QUESTIONS.length;
  const srcPool=ALL.filter(q=>store.src==="all"||q.src===store.src);
  const doms=[...new Set(srcPool.map(q=>q.domain))].sort();
  if(store.domain!=="all"&&!doms.includes(+store.domain)) store.domain="all";
  domainSel.innerHTML='<option value="all">All domains ('+srcPool.length+')</option>'+doms.map(d=>'<option value="'+d+'">Domain '+d+': '+DOMAINS[d]+' ('+srcPool.filter(q=>q.domain===d).length+')</option>').join("");
  domainSel.value=store.domain;
  missedOnly.checked=store.missedOnly;shuffle.checked=store.shuffle;shuffleQ.checked=store.shuffleQ;
  reshuffleBtn.style.visibility=store.shuffleQ?"visible":"hidden";
}

function renderGrid(list){
  if(!list.length){grid.innerHTML='<p class="empty-grid">No questions match these filters.</p>';gridNote.textContent="";return;}
  grid.innerHTML=list.map((q,i)=>{const r=store.answers[q.id];const cls=[r?(r.correct?"ok":"miss"):"",q.id===store.current?"cur":"",q.src==="ai"&&store.src==="all"?"ai":""].join(" ");
    return '<button class="'+cls+'" data-id="'+q.id+'" aria-label="Question '+(i+1)+(r?(r.correct?", correct":", missed"):", unanswered")+(q.src==="ai"?", AI-generated":", Tutorials Dojo")+'">'+(i+1)+'</button>';}).join("");
  gridNote.textContent=store.src==="all"?"Amber dot marks AI-generated questions.":"";
}

function instruction(q){
  if(q.type==="single") return "Choose one answer.";
  if(q.type==="multi") return "Choose "+q.pick+" answers.";
  if(q.type==="match") return "Pick a match for each item from the dropdowns.";
  return "Choose an item for each step, in order.";
}
function typeLabel(q){
  return {single:"Single choice",multi:"Multiple choice",match:"Matching",order:"Ordering"}[q.type];
}

function renderCard(){
  const list=filtered();
  renderStats();renderGrid(list);
  if(!list.length){
    card.innerHTML='<div class="emptystate"><h2>Nothing to show</h2><p>'+(store.missedOnly?"You have no missed questions under these filters. Turn off “Show missed only” to see everything.":"No questions match the current source and domain. Try a different combination.")+'</p></div>';return;
  }
  let idx=list.findIndex(q=>q.id===store.current);
  if(idx<0){idx=0;store.current=list[0].id;save();renderGrid(list);}
  const q=list[idx];const done=store.answers[q.id];
  const resp=done?done.resp:(draft[q.id]!==undefined?draft[q.id]:(q.type==="single"?null:q.type==="multi"?[]:q.type==="match"?q.prompts.map(()=>-1):Array(q.steps).fill(-1)));
  draft[q.id]=resp;

  const posPct=list.length>1?Math.round((idx/(list.length-1))*100):100;
  let h='<div class="qtrack"><div class="qtrack-fill" style="width:'+posPct+'%"></div></div>';
  h+='<div class="meta"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span><span class="tag">Domain '+q.domain+': '+DOMAINS[q.domain]+'</span><span class="tag">'+typeLabel(q)+'</span><span class="tag '+(q.src==="ai"?"src-ai":"")+'">'+(q.src==="ai"?"AI-generated":"Tutorials Dojo")+'</span></div>';
  h+='<div class="stem">'+paras(q.stem)+'</div><p class="instr">'+instruction(q)+'</p>';

  if(q.type==="single"||q.type==="multi"){
    const ord=displayOrder(q,q.choices.length);
    h+='<ul class="choices">'+ord.map((ci,pos)=>{
      const sel=q.type==="single"?resp===ci:resp.includes(ci);
      const isAns=q.type==="single"?q.answer===ci:q.answer.includes(ci);
      let cls="choice "+(q.type==="single"?"radio":"check");
      if(done){if(isAns)cls+=" right";else if(sel)cls+=" wrong";}else if(sel)cls+=" sel";
      const lab=done?(isAns?"Correct answer":(sel?"Your answer — incorrect":"Incorrect")):"";
      return '<li><button class="'+cls+'" data-ci="'+ci+'" '+(done?"disabled":"")+' role="'+(q.type==="single"?"radio":"checkbox")+'" aria-checked="'+sel+'"><span class="mark">'+(done?(isAns?"✓":(sel?"✕":LETTERS[pos])):LETTERS[pos])+'</span><span class="body">'+esc(q.choices[ci])+(done?'<span class="why"><b>'+lab+'.</b> '+esc(q.why[ci])+'</span>':'')+'</span></button></li>';
    }).join("")+'</ul>';
  }
  if(q.type==="match"){
    const ord=displayOrder(q,q.options.length);
    h+=q.prompts.map((p,pi)=>{
      let cls="matchrow";if(done)cls+=resp[pi]===q.answer[pi]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="m'+pi+'">'+esc(p)+'</label><select id="m'+pi+'" data-pi="'+pi+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(oi=>'<option value="'+oi+'" '+(resp[pi]===oi?"selected":"")+'>'+esc(q.options[oi])+'</option>').join("")+'</select>'+(done&&resp[pi]!==q.answer[pi]?'<div class="fix">Correct match: '+esc(q.options[q.answer[pi]])+'</div>':'')+'</div>';
    }).join("");
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.options.map((o,oi)=>'<li><b>'+esc(o)+(q.answer.includes(oi)?"":" (not used)")+'</b><span class="why">'+esc(q.why[oi])+'</span></li>').join("")+'</ul></div>';
  }
  if(q.type==="order"){
    const ord=displayOrder(q,q.items.length);
    h+='<div class="pool" style="border:0;margin:0;padding:0"><h3>Available steps</h3><ul>'+ord.map(ii=>'<li>'+esc(q.items[ii])+'</li>').join("")+'</ul></div><div style="margin-top:16px">';
    h+=resp.map((r,si)=>{
      let cls="matchrow step";if(done)cls+=r===q.answer[si]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="o'+si+'"><b>Step '+(si+1)+'</b></label><select id="o'+si+'" data-si="'+si+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(ii=>'<option value="'+ii+'" '+(r===ii?"selected":"")+'>'+esc(q.items[ii])+'</option>').join("")+'</select>'+(done&&r!==q.answer[si]?'<div class="fix">Correct step: '+esc(q.items[q.answer[si]])+'</div>':'')+'</div>';
    }).join("")+'</div>';
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.items.map((it,ii)=>'<li><b>'+esc(it)+'</b><span class="why">'+esc(q.why[ii])+'</span></li>').join("")+'</ul></div>';
  }

  if(done){
    const g=grade(q,done.resp);
    h+='<div class="feedback '+(done.correct?"ok":"miss")+'"><h3>'+(done.correct?"Correct":"Incorrect")+(g.total>1?" · "+g.got+" / "+g.total+" points":"")+'</h3><p>'+esc(q.explain)+'</p></div>';
  }

  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  h+='<div class="nav"><button class="btn" id="prevBtn" '+(idx===0?"disabled":"")+'>Previous</button><span class="spacer"></span>';
  if(done) h+='<button class="btn" id="retryBtn">Try again</button>';
  else h+='<button class="btn primary" id="checkBtn" '+(ready?"":"disabled")+'>Check answer</button>';
  h+='<button class="btn '+(done?"primary":"")+'" id="nextBtn" '+(idx===list.length-1?"disabled":"")+'>Next</button></div>';
  h+='<p class="kbd"><kbd>←</kbd> <kbd>→</kbd> move between questions · <kbd>A</kbd>–<kbd>E</kbd> pick a choice · <kbd>Enter</kbd> check answer</p>';
  card.classList.remove("fade-in");
  card.innerHTML=h;
  void card.offsetWidth;
  card.classList.add("fade-in");

  // events
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ci;
    if(q.type==="single") draft[q.id]=ci;
    else{const s=draft[q.id];const k=s.indexOf(ci);if(k>=0)s.splice(k,1);else if(s.length<q.pick)s.push(ci);else{s.shift();s.push(ci);}}
    renderCard();
  });
  card.querySelectorAll("select[data-pi]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.pi]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  card.querySelectorAll("select[data-si]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.si]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  const cb=document.getElementById("checkBtn");if(cb)cb.onclick=()=>check(q);
  const rb=document.getElementById("retryBtn");if(rb)rb.onclick=()=>{delete store.answers[q.id];delete draft[q.id];delete orderCache[q.id];save();renderCard();};
  document.getElementById("prevBtn").onclick=()=>go(-1);
  document.getElementById("nextBtn").onclick=()=>go(1);
}

function check(q){
  const resp=draft[q.id];
  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  if(!ready)return;
  const g=grade(q,resp);
  store.answers[q.id]={resp:JSON.parse(JSON.stringify(resp)),correct:g.correct};save();renderCard();
}
function go(d){
  const list=filtered();const i=list.findIndex(q=>q.id===store.current);const n=i+d;
  if(n<0||n>=list.length)return;store.current=list[n].id;save();renderCard();window.scrollTo({top:0});
}

// controls
document.querySelectorAll("#srcSeg button").forEach(b=>b.onclick=()=>{store.src=b.dataset.src;save();renderControls();renderCard();});
domainSel.onchange=()=>{store.domain=domainSel.value;save();renderCard();};
missedOnly.onchange=()=>{store.missedOnly=missedOnly.checked;save();renderCard();};
shuffle.onchange=()=>{store.shuffle=shuffle.checked;for(const k in orderCache)delete orderCache[k];save();renderCard();};
shuffleQ.onchange=()=>{store.shuffleQ=shuffleQ.checked;if(store.shuffleQ)store.qOrder=shuffledIds();save();renderControls();renderCard();};
reshuffleBtn.onclick=()=>{store.qOrder=shuffledIds();save();renderCard();};
grid.onclick=e=>{const b=e.target.closest("button[data-id]");if(!b)return;store.current=b.dataset.id;save();renderCard();if(window.innerWidth<=900){ctrl.open=false;card.scrollIntoView({behavior:"smooth"});}};
resetBtn.onclick=()=>{if(!confirm("Clear all answers and start over?"))return;store.answers={};for(const k in draft)delete draft[k];save();renderCard();};

resultsBtn.onclick=()=>{
  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  const ans=pool.filter(q=>store.answers[q.id]);const ok=ans.filter(q=>store.answers[q.id].correct);
  const row=(label,qs)=>{const a=qs.filter(q=>store.answers[q.id]);const o=a.filter(q=>store.answers[q.id].correct);const pct=a.length?Math.round(o.length/a.length*100):0;
    return '<div class="bar"><span>'+esc(label)+'</span><span class="n">'+o.length+' / '+a.length+'</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';};
  const doms=[...new Set(pool.map(q=>q.domain))].sort();
  const missed=pool.filter(q=>store.answers[q.id]&&!store.answers[q.id].correct);
  const pct=ans.length?Math.round(ok.length/ans.length*100):0;
  let h='<h2>Your results</h2><p style="margin:0;color:var(--muted)">'+ans.length+' of '+pool.length+' questions answered</p>';
  h+='<div class="scorepanel"><div class="ring" style="background:conic-gradient(var(--amber) '+(pct*3.6)+'deg, var(--line) 0deg)"><div class="ring-inner"><b>'+(ans.length?pct+"%":"–")+'</b><span>accuracy</span></div></div>';
  h+='<p>'+ok.length+' correct, '+(ans.length-ok.length)+' missed. AWS scales scores to 100–1,000 and requires 700 to pass, so aim for 80% or more here.</p></div>';
  h+='<h3 style="margin:22px 0 0;font-size:1rem">By domain</h3><div class="bars">'+doms.map(d=>row("Domain "+d+": "+DOMAINS[d],pool.filter(q=>q.domain===d))).join("")+'</div>';
  if(store.src==="all") h+='<h3 style="margin:10px 0 0;font-size:1rem">By source</h3><div class="bars">'+row("Tutorials Dojo",pool.filter(q=>q.src==="td"))+row("AI-generated",pool.filter(q=>q.src==="ai"))+'</div>';
  if(missed.length) h+='<h3 style="margin:10px 0 0;font-size:1rem">Missed questions</h3><div class="missed-list">'+missed.map(q=>'<button data-id="'+q.id+'">'+esc(q.stem.split("\n\n").slice(-1)[0].slice(0,110))+'…</button>').join("")+'</div>';
  h+='<div class="row">'+(missed.length?'<button class="btn" id="reviewMissed">Review missed only</button>':'')+'<button class="btn primary" id="closeRes">Close</button></div>';
  resultsBody.innerHTML=h;results.showModal();
  closeRes.onclick=()=>results.close();
  const rm=document.getElementById("reviewMissed");if(rm)rm.onclick=()=>{store.missedOnly=true;store.current=missed[0].id;save();renderControls();renderCard();results.close();};
  resultsBody.querySelectorAll(".missed-list button").forEach(b=>b.onclick=()=>{store.current=b.dataset.id;save();results.close();renderCard();});
};

document.addEventListener("keydown",e=>{
  if(results.open||e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="Enter"&&!e.target.closest("button")){const cb=document.getElementById("checkBtn");if(cb&&!cb.disabled)cb.click();}
  else{const i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0&&i<8){const btns=card.querySelectorAll(".choice:not(:disabled)");if(btns[i])btns[i].click();}}
});

if(window.innerWidth<=900)ctrl.open=false;
renderControls();renderCard();
})();
</script>
</body>
