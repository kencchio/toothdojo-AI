choices:["Knowledge Bases only retrieves and injects existing information into the prompt; it cannot call an API to actually make a reservation — that requires Agents for Amazon Bedrock","Knowledge Bases can both retrieve information and execute actions like making a reservation, so nothing additional is needed","Agents for Amazon Bedrock is only for retrieving information, so it wouldn't help here either","Guardrails for Amazon Bedrock is what's needed to perform the reservation action"],answer:0,
why:["Knowledge Bases is purely a retrieval mechanism (RAG) — it can help surface indexed information like availability data, but has no mechanism to call an external API and actually change state, like completing a reservation. Agents are specifically built to call APIs or Lambda functions as multi-step actions to accomplish tasks like this.","Knowledge Bases retrieves and injects documents into a prompt; it does not execute external actions such as writing to a reservation system.","This reverses the two features — Agents are exactly the capability that lets a model take multi-step actions like calling an API, which is what's needed for the reservation step.","Guardrails control what the model is allowed to say (content filtering); they have no mechanism for executing external actions."],
explain:"Retrieving information (even live, current information) and taking an action that changes something in another system are different capabilities in Bedrock: Knowledge Bases for the former, Agents for the latter."},

{id:"ai3-07",src:"ai",domain:3,type:"single",
stem:"A company's Bedrock-based assistant sometimes states specific product prices that don't match its connected product catalog, effectively making up numbers not present in the retrieved context. Separately, the company wants to block any mention of a competitor's name entirely.\n\nWhich single Bedrock feature addresses BOTH the hallucinated-numbers problem and the blocked-topic requirement?",
choices:["Guardrails for Amazon Bedrock, using its contextual grounding check to catch responses not supported by retrieved context, together with a denied-topics policy for the competitor's name","Knowledge Bases, since better retrieval alone guarantees the model will never state an unsupported number again","Model Evaluation, since it can automatically rewrite ungrounded responses before they reach the user","Agents for Amazon Bedrock, since agents automatically fact-check every claim against connected systems"],answer:0,
why:["Guardrails' contextual grounding check specifically flags responses not supported by the retrieved source content — directly addressing hallucinated numbers — while its denied-topics configuration is exactly the mechanism for blocking mentions of something like a competitor's name. Both live under the same Guardrails feature.","Better retrieval reduces the chance of ungrounded answers but doesn't guarantee it, and doesn't provide a mechanism to block a specific topic like a competitor's name — that's a Guardrails job either way.","Model Evaluation is for offline benchmarking and comparison of models; it doesn't run in real time to rewrite responses before users see them.","Agents orchestrate multi-step actions and API calls; they don't include a general fact-checking or contextual grounding capability by default."],
explain:"Guardrails bundles multiple runtime content controls — denied topics, PII redaction, and contextual grounding checks for hallucination — under one feature, which is why it's the single answer to both parts of this scenario."},

{id:"ai3-08",src:"ai",domain:3,type:"single",
stem:"A company fine-tuned a Titan model in Amazon Bedrock. Before committing to a long-term throughput purchase, they want to run a short evaluation of the custom model's quality, keeping costs minimal, before deciding on a longer commitment.\n\nWhich statement correctly describes their options?",
choices:["They can purchase Provisioned Throughput on an hourly, no-commitment basis to evaluate the custom model first, then move to a longer commitment later if satisfied","They can run the fine-tuned model on-demand with no Provisioned Throughput at all, exactly like a base model","They must commit to at least a six-month Provisioned Throughput term before any inference is possible","Evaluating a custom model always requires starting a brand-new fine-tuning job"],answer:0,
why:["Custom (fine-tuned) models in Bedrock require Provisioned Throughput to run, but that doesn't mean a long commitment is mandatory — a no-commitment, hourly option exists specifically so a team can test and evaluate a custom model's quality before committing to a longer term.","Base, unmodified models can typically be used on-demand, but a fine-tuned custom model in Bedrock still requires Provisioned Throughput before it can serve inference — this is one of the differences between a base model and a custom one.","A no-commitment hourly option is available precisely so a team doesn't have to commit to a long term just to evaluate a custom model.","Evaluating an already fine-tuned model doesn't require starting a new fine-tuning job — the team evaluates the model it already has by purchasing Provisioned Throughput for it and running inference."],
explain:"Custom models in Bedrock need Provisioned Throughput to run at all, but that capacity can be purchased hourly with no long-term commitment — useful for evaluating a custom model before deciding on a longer term."},

{id:"ai3-09",src:"ai",domain:3,type:"single",
stem:"A company already fine-tuned an open-weights model completely outside of AWS, using its own GPU cluster, and now wants to serve that exact model through Bedrock's managed API rather than running its own hosting infrastructure. A teammate suggests just re-running Bedrock's fine-tuning job on the same data instead.\n\nWhy is Custom Model Import the more direct solution here, compared to re-running fine-tuning in Bedrock?",
choices:["Custom Model Import lets the company bring the already-trained model artifact directly into Bedrock to serve as-is, without re-running training or trying to recreate the exact same result through a separate fine-tuning job","Bedrock fine-tuning is guaranteed to produce a mathematically identical model to the externally trained one, so either approach works equally well","Custom Model Import is only for base, non-fine-tuned models","Bedrock cannot serve any model that wasn't originally trained using AWS services"],answer:0,
why:["The company already has a finished, trained model — Custom Model Import is built specifically to bring that exact artifact into Bedrock to serve it, avoiding the cost, time, and risk of trying to reproduce the same result by re-running a fine-tuning job on AWS.","Re-running training, even on the same data, doesn't guarantee an identical model, due to factors like random initialization and differences in training environment — so this isn't a reliable substitute for importing the model already trained.","Custom Model Import is specifically meant for bringing in already-customized (including fine-tuned) models — that's its core purpose, not a restriction against it.","This is exactly what Custom Model Import enables — serving a model that was trained outside of AWS through Bedrock's managed API."],
explain:"When a model already exists and was trained elsewhere, Custom Model Import serves it directly. Re-running Bedrock's own fine-tuning process is a different, and unnecessary, path to try to recreate a result that already exists."},

{id:"ai3-10",src:"ai",domain:3,type:"single",
stem:"A team is choosing between Bedrock's automatic and human-based Model Evaluation job types. They first want a fast, low-cost way to narrow five candidate models down to two based on benchmark metrics, and only then have their own reviewers manually judge tone and helpfulness on the remaining two.\n\nWhich sequence correctly matches Bedrock's Model Evaluation capabilities to each stage?",
choices:["Automatic evaluation first (benchmark metrics, fast and low-cost) to narrow down candidates, then human-based evaluation (team review) for the more nuanced tone and helpfulness judgment on the finalists","Human-based evaluation first for all five models, since human judgment is always more accurate than benchmark metrics","Automatic evaluation for both stages, since Bedrock's automatic metrics already capture tone and helpfulness","Guardrails for the first stage and Agents for the second stage"],answer:0,
why:["Automatic evaluation using benchmark metrics is the faster, cheaper way to do a first-pass narrowing across many candidates. Human-based evaluation, where the team reviews outputs itself, is better suited to nuanced, subjective qualities like tone and helpfulness — which is why it's used on the smaller shortlist.","Running human review across all five models first defeats the purpose of using a fast, low-cost first pass to narrow the field before spending reviewer time.","Automatic benchmark metrics are useful for measurable qualities but are not a substitute for human judgment on subjective qualities like tone and helpfulness — that's specifically why the human-based job type exists.","Guardrails and Agents serve entirely different purposes (content filtering and multi-step actions) and aren't part of Bedrock's Model Evaluation capability at all."],
explain:"Bedrock Model Evaluation supports both automatic (benchmark-metric-based, fast, cheap) and human-based (team judgment, better for subjective qualities) job types — using them in that order, cheap-and-broad first, then narrow-and-nuanced, is a natural evaluation funnel."},

{id:"ai3-11",src:"ai",domain:3,type:"single",
stem:"A design team generates a batch of marketing images using Amazon Titan Image Generator. Months later, a dispute arises over whether a specific image circulating online originally came from their Bedrock account's generations.\n\nWhich built-in AWS capability could help establish that an image was produced by Titan Image Generator?",
choices:["The invisible watermark Titan Image Generator embeds in every image it creates by default, which can later be checked to indicate AI-generated origin from this service","Guardrails' contextual grounding check, since it verifies whether generated content is grounded in truth","SageMaker Model Cards, since they document which images a model produced","Amazon Rekognition's content moderation labels, since they flag AI-generated content by default"],answer:0,
why:["Titan Image Generator embeds an invisible watermark by default in the images it produces, which exists specifically to support later verification that an image originated from this service.","Contextual grounding check evaluates whether a text response is supported by retrieved source content — it has nothing to do with verifying the provenance of a generated image.","Model Cards document a model's intended use, limitations, and training data — they don't track or embed markers in individual outputs.","Rekognition's moderation labels flag unsafe or inappropriate content in an image; they aren't designed to detect or flag AI-generated origin."],
explain:"Content-provenance questions about Titan-generated images point specifically to its default invisible watermarking — a feature built for exactly this kind of after-the-fact verification."},

{id:"ai3-12",src:"ai",domain:3,type:"single",
stem:"A company already has Amazon Kendra indexing its internal wikis and documents for search. Employees now want to ask natural-language questions and get a synthesized, conversational answer grounded in that same internal content, rather than a list of matching documents to read through themselves.\n\nWhat does Amazon Q Business add on top of what Kendra alone already provides?",
choices:["Q Business is a generative, conversational assistant that synthesizes a direct answer grounded in enterprise content; Kendra returns a ranked list of relevant documents rather than a synthesized conversational answer","Q Business and Kendra return exactly the same output format, so there's no meaningful difference","Kendra already generates full conversational answers, making Q Business unnecessary","Q Business replaces the need for any document indexing at all"],answer:0,
why:["Kendra is a search service — it ranks and returns relevant documents or passages for a query. Q Business is built to go further: it's a generative assistant that can synthesize a direct, conversational answer grounded in enterprise data, and can use a retriever like Kendra under the hood.","Search results (a ranked list of documents) and a synthesized conversational answer are different output formats serving different needs — that's the core distinction being tested.","Kendra's core function is retrieval and search, returning matching documents — it isn't itself a generative conversational assistant.","Q Business still relies on indexed or connected enterprise content, which can include a Kendra index, to ground its answers — it doesn't eliminate the need for that underlying content and indexing."],
explain:"Kendra retrieves; Q Business (a generative assistant, often built using retrieval components like Kendra) synthesizes a conversational answer from what's retrieved. They can work together rather than being redundant."},

{id:"ai3-13",src:"ai",domain:3,type:"single",
stem:"A software team wants in-IDE code suggestions, automated security-vulnerability scanning of their codebase, and help upgrading a legacy Java application to a newer version. A teammate suggests just calling a general-purpose foundation model in Amazon Bedrock directly from a custom-built IDE plugin instead of using a dedicated coding assistant service.\n\nWhat is the strongest reason to prefer Amazon Q Developer over building this with a raw Bedrock FM call?",
choices:["Q Developer is purpose-built with IDE integration, security scanning, and application code-transformation capabilities (like Java upgrades) already built in, rather than requiring the team to build that tooling themselves around a general-purpose model","A raw foundation model in Bedrock is architecturally incapable of ever generating code","Q Developer and a raw Bedrock FM call would require the exact same amount of custom development work","Bedrock models cannot be integrated into IDE plugins under any circumstances"],answer:0,
why:["Q Developer already packages IDE integration, security scanning, and specific code-transformation workflows like Java version upgrades as ready-to-use capabilities — a team calling a general-purpose Bedrock FM directly would need to build all of that tooling and workflow logic themselves.","General-purpose foundation models, including many available through Bedrock, are commonly used for code generation — that's not a technical impossibility.","Using a purpose-built coding assistant with these capabilities already built in requires substantially less custom development than building the same tooling around a raw model call.","Bedrock models can be integrated into custom applications, including IDE plugins, via its API — that's not a hard restriction; the point is that Q Developer already provides this integration and more, out of the box."],
explain:"The distinction is 'raw model access' versus 'purpose-built product with the workflow already built around it' — Q Developer is the latter for coding-specific tasks like security scanning and code transformation."},

{id:"ai3-14",src:"ai",domain:3,type:"single",
stem:"A company is building a RAG architecture and is deciding between Amazon Kendra and Amazon OpenSearch Service (with k-NN) as the retrieval component. They specifically want built-in connectors to existing enterprise systems (like SharePoint and file shares) and relevance tuning, without building and maintaining their own embedding and indexing pipeline.\n\nWhich service better fits this specific requirement, and why?",
choices:["Amazon Kendra, since it's an intelligent enterprise search service with built-in connectors and relevance tuning, requiring less custom pipeline-building than a raw vector store approach","Amazon OpenSearch Service, since k-NN search is always faster than any other retrieval method regardless of the use case","Both are functionally identical for this requirement, so either would require the same amount of setup","Neither service can be used as a retriever in a RAG architecture"],answer:0,
why:["Kendra is built as an intelligent enterprise search service with pre-built connectors to common enterprise data sources and relevance-tuning features — reducing the custom pipeline work compared to standing up an embedding and vector-indexing process on OpenSearch.","Raw retrieval speed isn't the deciding factor here — the requirement is about built-in enterprise connectors and relevance tuning with less custom pipeline work, which favors Kendra's more turnkey approach.","Kendra's built-in connectors and relevance tuning represent meaningfully less setup work than building a custom embedding and k-NN indexing pipeline on OpenSearch for the same enterprise data sources — they aren't equivalent in effort.","Both services are commonly used as retriever components in RAG architectures alongside Bedrock — this option incorrectly rules out something both are actually used for."],
explain:"OpenSearch with k-NN is a flexible, general-purpose vector search engine you build a pipeline around; Kendra is a more turnkey, enterprise-search-oriented retriever with built-in connectors — the right pick depends on how much custom pipeline work a team wants to own."},

{id:"ai3-15",src:"ai",domain:3,type:"single",
stem:"A company wants to cut costs on two separate workloads: (1) training a new large model from scratch, and (2) running high-volume inference for an already-trained model in production. A vendor suggests using AWS Trainium for BOTH workloads since it's AWS's newest AI chip.\n\nWhy is this suggestion only half right?",
choices:["Trainium is optimized for training, not inference; the production inference workload would be better served by AWS Inferentia instead","Trainium is optimized for inference, not training, so the vendor has both workloads backwards","Using the same chip for both workloads is always the most cost-effective choice regardless of workload type","Neither Trainium nor Inferentia is relevant to cost reduction; only instance count affects cost"],answer:0,
why:["Trainium is purpose-built to reduce the cost of training large models — a good fit for the first workload. For the second workload (high-volume production inference), Inferentia is the chip purpose-built to reduce inference cost — using Trainium for both misses the better-optimized option for the inference half.","This reverses the chips' actual specializations — Trainium targets training cost, Inferentia targets inference cost.","Matching the chip to the specific workload (training vs. inference) is what actually optimizes cost — using one chip for both, when a better-suited option exists for one of the workloads, leaves savings on the table.","The choice of specialized silicon, like Trainium vs. Inferentia, is specifically about improving cost and performance for a given workload type — it's a real, relevant lever, not irrelevant to cost."],
explain:"Trainium = training cost optimization. Inferentia = inference cost optimization. A cost-conscious architecture typically uses each chip for the workload it's actually optimized for, rather than one chip for everything."},

{id:"ai3-16",src:"ai",domain:3,type:"match",
stem:"Match each evaluation concept to what it measures. Two of the options are classification metrics that don't belong to any of the four descriptions. (Select FOUR.)",
prompts:["Overlap of n-grams between generated and reference text, commonly used for machine translation","How confidently a language model predicts the next token in a sequence","Semantic similarity between generated and reference text using embeddings, useful when wording differs but meaning should match","Overlap of n-grams and sequences between generated and reference text, commonly used for summarization"],
options:["BLEU","Perplexity","BERTScore","ROUGE","F1 score","Accuracy"],answer:[0,1,2,3],
why:["N-gram precision overlap, the standard metric for translation quality.","Measures how confidently a model predicts the next token — lower means more confident predictions — a fluency measure, not a correctness measure.","Uses embeddings to compare semantic similarity, useful when the exact wording differs but the meaning should still match.","N-gram and sequence recall overlap, the standard metric for summarization quality.","The harmonic mean of precision and recall for classification tasks — not a text-generation quality metric, so it doesn't match any of the four descriptions here.","The overall correct-prediction rate for classification tasks — also not designed to score generated text against a reference."],
explain:"BLEU (translation) and ROUGE (summarization) both measure surface n-gram overlap and share the same blind spot: they penalize valid paraphrasing. Perplexity measures fluency, not correctness. BERTScore captures meaning through embeddings. F1 and accuracy belong to a different family of metrics entirely — classification, not text generation."},

{id:"ai3-17",src:"ai",domain:3,type:"match",
stem:"A team is evaluating the quality of a RAG (Retrieval-Augmented Generation) system. Match each quality concept to what it checks. (Select THREE.)",
prompts:["Does the retrieval step fetch information from the right documents?","Does the generated answer stick to the retrieved context instead of making things up?","Does the generated answer actually address the user's original question?"],
options:["Context relevance","Faithfulness","Answer relevance","Perplexity","Recall"],answer:[0,1,2],
why:["Checks whether the retrieval step fetched the right documents for the query.","Checks whether the generated answer sticks to the retrieved context rather than hallucinating beyond it.","Checks whether the final answer actually addresses the user's question.","A general language-model fluency measure — it doesn't evaluate retrieval quality or grounding, so it doesn't fit any of these RAG-specific checks.","A classification metric measuring how many actual positives were caught — it isn't designed to evaluate retrieval quality, grounding, or answer usefulness in a RAG pipeline either."],
explain:"These three RAG-specific quality checks are conceptually testable even without memorizing a framework name: faithfulness, context relevance, and answer relevance cover grounding, retrieval quality, and answer usefulness separately."},

{id:"ai3-18",src:"ai",domain:3,type:"order",steps:4,
stem:"Rank the following Amazon Bedrock model customization approaches from the one that changes the model LEAST to the one that changes it MOST. One listed item is not a customization approach at all — leave it out. (Select and order FOUR.)",
items:["Prompt engineering","RAG using Knowledge Bases","Fine-tuning","Continued pre-training","Purchasing Provisioned Throughput"],
answer:[0,1,2,3],
why:["Step 1 (least change). Only the input prompt changes; model weights are untouched.","Step 2. Grounds responses in retrieved data at query time; model weights are still untouched, but the model now has access to more information.","Step 3. Updates model weights using labeled data to change style, format, or behavior.","Step 4 (most change). Adapts the model's base knowledge using a large amount of unlabeled domain data, going further than a single fine-tuning pass.","A capacity and pricing decision needed to SERVE a customized model — it isn't itself a way of customizing the model's behavior, so it doesn't belong on this ladder."],
explain:"Bedrock's customization ladder, in order of how much they change the model: prompt engineering → RAG → fine-tuning → continued pre-training. Provisioned Throughput is a separate, capacity-related decision."},

{id:"ai3-19",src:"ai",domain:3,type:"single",
stem:"A company hosts 200 lightweight ML models. Each model is called occasionally and unpredictably throughout the day, and requests are small and expect a quick synchronous response. Running 200 separate always-on real-time endpoints would be expensive and mostly idle. A teammate suggests asynchronous inference instead, since it also scales to zero when idle.\n\nWhy is a multi-model endpoint the better fit than asynchronous inference here?",
choices:["The requests are small and expect a quick synchronous response, which multi-model endpoints provide by hosting many models behind one real-time endpoint; asynchronous inference queues requests and returns results later, which doesn't match that need","Asynchronous inference is strictly cheaper than a multi-model endpoint in every case","Multi-model endpoints cannot serve more than a handful of models at once","A multi-model endpoint and asynchronous inference solve the exact same problem, so either would work identically"],answer:0,
why:["Multi-model endpoints load many models behind a single real-time endpoint, keeping the low-latency, synchronous request/response pattern the scenario needs, while sharing infrastructure cost across all 200 models. Asynchronous inference is built for a different pattern — queueing requests, often large or slow ones, and returning results later — which doesn't match 'small requests, quick synchronous response.'","Relative cost depends on traffic patterns and payload or processing characteristics; the deciding factor here is the request pattern (synchronous, quick), not a blanket cost rule.","Multi-model endpoints are specifically designed to host many models — hundreds is a realistic scenario for this feature, not a limitation of it.","They solve related but different problems: cheaply hosting many low-traffic models behind one real-time endpoint (multi-model) versus handling large or slow individual requests asynchronously (async inference) — the request pattern here clearly matches the former."],
explain:"Match the requirement precisely: many models, low individual traffic, and a need for a quick synchronous response points to a multi-model endpoint. Large payloads or long processing time, with the response not needed immediately, points to asynchronous inference."},

{id:"ai3-20",src:"ai",domain:3,type:"single",
stem:"A compliance team wants a single document per model version that explains its intended use, known limitations, training data sources, and risk considerations, for external auditors to review. A colleague suggests SageMaker Model Registry is sufficient, since it already tracks model versions and approval status.\n\nWhy does Model Registry alone not fully satisfy this requirement?",
choices:["Model Registry tracks versioning, metadata, and approval status for deployment, but SageMaker Model Cards are specifically designed to hold the descriptive documentation (intended use, limitations, training data, risk considerations) auditors need to read","Model Registry already generates the exact narrative documentation auditors need, so nothing else is required","SageMaker Model Cards and Model Registry are the same feature under two different names","Model Registry cannot track more than one version of a model, so it can't support an audit across versions"],answer:0,
why:["Model Registry's job is cataloging versions, associating metadata like training metrics, and managing approval status — it isn't designed to hold the narrative, human-readable documentation, such as intended use and limitations, that Model Cards are specifically built to capture.","Model Registry stores structured metadata and version/approval status, not the kind of narrative documentation an auditor would read to understand a model's intended use and limitations — that's what Model Cards add.","They serve related but distinct purposes within governance: Registry for versioning and approval, Model Cards for descriptive documentation — they aren't interchangeable.","Model Registry is specifically designed to catalog and manage multiple model versions — that's one of its core functions, not a limitation."],
explain:"Model Registry (versions, metadata, approval workflow) and Model Cards (descriptive documentation of intended use, limitations, and risk) are complementary but distinct governance tools — an audit typically needs both."},

{id:"ai3-21",src:"ai",domain:3,type:"single",
stem:"A company wants to deploy an open-source Llama model that Amazon Bedrock doesn't currently offer, running on a specific GPU instance type they've already benchmarked for cost efficiency. They have NOT trained or fine-tuned this model themselves — they want to deploy the publicly available pre-trained version as-is. A teammate suggests Custom Model Import, since it's built for bringing in models AWS doesn't natively host.\n\nWhy is SageMaker JumpStart the better fit than Custom Model Import here?",
choices:["Custom Model Import is for bringing a model you've already trained or fine-tuned yourself into Bedrock; since this team hasn't trained anything and just wants to deploy a publicly available pre-trained model onto chosen infrastructure, JumpStart's pre-trained model catalog and deployment flow fits better","Custom Model Import and JumpStart are functionally identical, so it doesn't matter which is used","JumpStart cannot deploy any model that isn't already available through Bedrock","Custom Model Import is the only way to select a specific GPU instance type"],answer:0,
why:["Custom Model Import brings a model already customized (fine-tuned) elsewhere into Bedrock to serve through its managed API — it assumes training already happened. This team wants to deploy an existing public pre-trained model as-is onto infrastructure they choose, which is exactly JumpStart's use case: a catalog of pre-trained models deployable onto SageMaker instances you select.","The two serve different situations — one for models already trained or fine-tuned (Custom Model Import into Bedrock), one for deploying existing pre-trained models onto chosen infrastructure (JumpStart) — they aren't interchangeable.","JumpStart's catalog is broader than, and largely independent of, what's available through Bedrock — it specifically includes many models Bedrock doesn't offer, which is the reason it's relevant here.","JumpStart deployments also let you choose the SageMaker instance type the model runs on — instance selection isn't unique to Custom Model Import."],
explain:"The deciding detail is whether a trained or fine-tuned model already exists to bring in (Custom Model Import, into Bedrock) versus wanting to deploy an existing pre-trained model onto infrastructure you control (JumpStart)."},

{id:"ai3-22",src:"ai",domain:3,type:"single",
stem:"A team's application currently calls Bedrock's InvokeModel API separately for Claude, Titan, and Llama, and has to write different request/response parsing logic for each provider's unique format. They want to simplify this into one consistent request and response structure across all providers, including support for streaming partial responses back to the UI as they're generated.\n\nWhich Bedrock API addresses both needs?",
choices:["The Converse (and ConverseStream) API, which standardizes the conversation request/response format across model providers and supports streaming responses","InvokeModel, since it already standardizes formats across all providers by design","Batch inference, since it is optimized for interactive, streaming use cases","Custom Model Import, since importing a model automatically normalizes its request format"],answer:0,
why:["Converse, with its streaming counterpart ConverseStream, is AWS's newer, unified API specifically designed to standardize the conversation format across Bedrock's different model providers, removing the need for provider-specific parsing, while also supporting streamed partial responses.","InvokeModel is the older, more basic API where request and response formats can differ by provider — precisely the inconsistency the team is trying to get away from.","Batch inference runs large jobs asynchronously and non-interactively — the opposite of a use case needing live streaming responses to a UI.","Importing a model changes how it's hosted, not the shape of the request/response API used to call it — it doesn't address format standardization across providers."],
explain:"Converse/ConverseStream is the AWS-recommended, unified API precisely because it removes provider-specific request/response differences and adds native streaming support — both needs in this scenario."}
];

</script>
<script>
(function(){
const DOMAINS={1:"Fundamentals of AI and ML",2:"Fundamentals of Generative AI",3:"Applications of Foundation Models",4:"Guidelines for Responsible AI",5:"Security, Compliance, and Governance"};
const ALL=[...TD_QUESTIONS,...AI_QUESTIONS];
const BY_ID=Object.fromEntries(ALL.map(q=>[q.id,q]));
const KEY="aif-drill-v1";
const LETTERS="ABCDEFGH";

let store={answers:{},src:"all",domain:"all",missedOnly:false,shuffle:false,shuffleQ:false,qOrder:null,current:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

const draft={}; // unsubmitted selections per question id
const orderCache={}; // shuffled display order per question
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function paras(s){return s.split(/\n\n+/).map(p=>"<p>"+esc(p)+"</p>").join("");}
function shuffled(n,seed){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function displayOrder(q,n){
  if(!store.shuffle) return [...Array(n).keys()];
  if(!orderCache[q.id]) orderCache[q.id]=shuffled(n);
  return orderCache[q.id];
}
function shuffledIds(){
  const ids=ALL.map(q=>q.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return ids;
}
function baseList(){
  if(store.shuffleQ&&Array.isArray(store.qOrder)&&store.qOrder.length===ALL.length){
    return store.qOrder.map(id=>BY_ID[id]).filter(Boolean);
  }
  return ALL;
}

function filtered(){
  return baseList().filter(q=>(store.src==="all"||q.src===store.src)
    &&(store.domain==="all"||String(q.domain)===store.domain)
    &&(!store.missedOnly||(store.answers[q.id]&&!store.answers[q.id].correct)));
}

function grade(q,resp){
  if(q.type==="single") return {correct:resp===q.answer,got:resp===q.answer?1:0,total:1};
  if(q.type==="multi"){const a=[...q.answer].sort().join(),r=[...resp].sort().join();return {correct:a===r,got:resp.filter(x=>q.answer.includes(x)).length,total:q.answer.length};}
  if(q.type==="match"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
  if(q.type==="order"){const got=q.answer.filter((a,i)=>resp[i]===a).length;return {correct:got===q.answer.length,got,total:q.answer.length};}
}

function renderStats(){
  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  let a=0,ok=0;pool.forEach(q=>{const r=store.answers[q.id];if(r){a++;if(r.correct)ok++;}});
  sAns.textContent=a;sOk.textContent=ok;sMiss.textContent=a-ok;sAcc.textContent=a?Math.round(ok/a*100)+"%":"–";
  subline.textContent=pool.length+" review questions with explanations for every choice.";
}

function renderControls(){
  document.querySelectorAll("#srcSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.src===store.src));
  cAll.textContent=ALL.length;cTd.textContent=TD_QUESTIONS.length;cAi.textContent=AI_QUESTIONS.length;
  const srcPool=ALL.filter(q=>store.src==="all"||q.src===store.src);
  const doms=[...new Set(srcPool.map(q=>q.domain))].sort();
  if(store.domain!=="all"&&!doms.includes(+store.domain)) store.domain="all";
  domainSel.innerHTML='<option value="all">All domains ('+srcPool.length+')</option>'+doms.map(d=>'<option value="'+d+'">Domain '+d+': '+DOMAINS[d]+' ('+srcPool.filter(q=>q.domain===d).length+')</option>').join("");
  domainSel.value=store.domain;
  missedOnly.checked=store.missedOnly;shuffle.checked=store.shuffle;shuffleQ.checked=store.shuffleQ;
  reshuffleBtn.style.visibility=store.shuffleQ?"visible":"hidden";
}

function renderGrid(list){
  if(!list.length){grid.innerHTML='<p class="empty-grid">No questions match these filters.</p>';gridNote.textContent="";return;}
  grid.innerHTML=list.map((q,i)=>{const r=store.answers[q.id];const cls=[r?(r.correct?"ok":"miss"):"",q.id===store.current?"cur":"",q.src==="ai"&&store.src==="all"?"ai":""].join(" ");
    return '<button class="'+cls+'" data-id="'+q.id+'" aria-label="Question '+(i+1)+(r?(r.correct?", correct":", missed"):", unanswered")+(q.src==="ai"?", AI-generated":", Tutorials Dojo")+'">'+(i+1)+'</button>';}).join("");
  gridNote.textContent=store.src==="all"?"Amber dot marks AI-generated questions.":"";
}

function instruction(q){
  if(q.type==="single") return "Choose one answer.";
  if(q.type==="multi") return "Choose "+q.pick+" answers.";
  if(q.type==="match") return "Pick a match for each item from the dropdowns.";
  return "Choose an item for each step, in order.";
}
function typeLabel(q){
  return {single:"Single choice",multi:"Multiple choice",match:"Matching",order:"Ordering"}[q.type];
}

function renderCard(){
  const list=filtered();
  renderStats();renderGrid(list);
  if(!list.length){
    card.innerHTML='<div class="emptystate"><h2>Nothing to show</h2><p>'+(store.missedOnly?"You have no missed questions under these filters. Turn off “Show missed only” to see everything.":"No questions match the current source and domain. Try a different combination.")+'</p></div>';return;
  }
  let idx=list.findIndex(q=>q.id===store.current);
  if(idx<0){idx=0;store.current=list[0].id;save();renderGrid(list);}
  const q=list[idx];const done=store.answers[q.id];
  const resp=done?done.resp:(draft[q.id]!==undefined?draft[q.id]:(q.type==="single"?null:q.type==="multi"?[]:q.type==="match"?q.prompts.map(()=>-1):Array(q.steps).fill(-1)));
  draft[q.id]=resp;

  const posPct=list.length>1?Math.round((idx/(list.length-1))*100):100;
  let h='<div class="qtrack"><div class="qtrack-fill" style="width:'+posPct+'%"></div></div>';
  h+='<div class="meta"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span><span class="tag">Domain '+q.domain+': '+DOMAINS[q.domain]+'</span><span class="tag">'+typeLabel(q)+'</span><span class="tag '+(q.src==="ai"?"src-ai":"")+'">'+(q.src==="ai"?"AI-generated":"Tutorials Dojo")+'</span></div>';
  h+='<div class="stem">'+paras(q.stem)+'</div><p class="instr">'+instruction(q)+'</p>';

  if(q.type==="single"||q.type==="multi"){
    const ord=displayOrder(q,q.choices.length);
    h+='<ul class="choices">'+ord.map((ci,pos)=>{
      const sel=q.type==="single"?resp===ci:resp.includes(ci);
      const isAns=q.type==="single"?q.answer===ci:q.answer.includes(ci);
      let cls="choice "+(q.type==="single"?"radio":"check");
      if(done){if(isAns)cls+=" right";else if(sel)cls+=" wrong";}else if(sel)cls+=" sel";
      const lab=done?(isAns?"Correct answer":(sel?"Your answer — incorrect":"Incorrect")):"";
      return '<li><button class="'+cls+'" data-ci="'+ci+'" '+(done?"disabled":"")+' role="'+(q.type==="single"?"radio":"checkbox")+'" aria-checked="'+sel+'"><span class="mark">'+(done?(isAns?"✓":(sel?"✕":LETTERS[pos])):LETTERS[pos])+'</span><span class="body">'+esc(q.choices[ci])+(done?'<span class="why"><b>'+lab+'.</b> '+esc(q.why[ci])+'</span>':'')+'</span></button></li>';
    }).join("")+'</ul>';
  }
  if(q.type==="match"){
    const ord=displayOrder(q,q.options.length);
    h+=q.prompts.map((p,pi)=>{
      let cls="matchrow";if(done)cls+=resp[pi]===q.answer[pi]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="m'+pi+'">'+esc(p)+'</label><select id="m'+pi+'" data-pi="'+pi+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(oi=>'<option value="'+oi+'" '+(resp[pi]===oi?"selected":"")+'>'+esc(q.options[oi])+'</option>').join("")+'</select>'+(done&&resp[pi]!==q.answer[pi]?'<div class="fix">Correct match: '+esc(q.options[q.answer[pi]])+'</div>':'')+'</div>';
    }).join("");
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.options.map((o,oi)=>'<li><b>'+esc(o)+(q.answer.includes(oi)?"":" (not used)")+'</b><span class="why">'+esc(q.why[oi])+'</span></li>').join("")+'</ul></div>';
  }
  if(q.type==="order"){
    const ord=displayOrder(q,q.items.length);
    h+='<div class="pool" style="border:0;margin:0;padding:0"><h3>Available steps</h3><ul>'+ord.map(ii=>'<li>'+esc(q.items[ii])+'</li>').join("")+'</ul></div><div style="margin-top:16px">';
    h+=resp.map((r,si)=>{
      let cls="matchrow step";if(done)cls+=r===q.answer[si]?" right":" wrong";
      return '<div class="'+cls+'"><label class="p" for="o'+si+'"><b>Step '+(si+1)+'</b></label><select id="o'+si+'" data-si="'+si+'" '+(done?"disabled":"")+'><option value="-1">Select…</option>'+ord.map(ii=>'<option value="'+ii+'" '+(r===ii?"selected":"")+'>'+esc(q.items[ii])+'</option>').join("")+'</select>'+(done&&r!==q.answer[si]?'<div class="fix">Correct step: '+esc(q.items[q.answer[si]])+'</div>':'')+'</div>';
    }).join("")+'</div>';
    if(done) h+='<div class="pool"><h3>Every option explained</h3><ul>'+q.items.map((it,ii)=>'<li><b>'+esc(it)+'</b><span class="why">'+esc(q.why[ii])+'</span></li>').join("")+'</ul></div>';
  }

  if(done){
    const g=grade(q,done.resp);
    h+='<div class="feedback '+(done.correct?"ok":"miss")+'"><h3>'+(done.correct?"Correct":"Incorrect")+(g.total>1?" · "+g.got+" / "+g.total+" points":"")+'</h3><p>'+esc(q.explain)+'</p></div>';
  }

  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  h+='<div class="nav"><button class="btn" id="prevBtn" '+(idx===0?"disabled":"")+'>Previous</button><span class="spacer"></span>';
  if(done) h+='<button class="btn" id="retryBtn">Try again</button>';
  else h+='<button class="btn primary" id="checkBtn" '+(ready?"":"disabled")+'>Check answer</button>';
  h+='<button class="btn '+(done?"primary":"")+'" id="nextBtn" '+(idx===list.length-1?"disabled":"")+'>Next</button></div>';
  h+='<p class="kbd"><kbd>←</kbd> <kbd>→</kbd> move between questions · <kbd>A</kbd>–<kbd>E</kbd> pick a choice · <kbd>Enter</kbd> check answer</p>';
  card.classList.remove("fade-in");
  card.innerHTML=h;
  void card.offsetWidth;
  card.classList.add("fade-in");

  // events
  card.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ci;
    if(q.type==="single") draft[q.id]=ci;
    else{const s=draft[q.id];const k=s.indexOf(ci);if(k>=0)s.splice(k,1);else if(s.length<q.pick)s.push(ci);else{s.shift();s.push(ci);}}
    renderCard();
  });
  card.querySelectorAll("select[data-pi]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.pi]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  card.querySelectorAll("select[data-si]").forEach(s=>s.onchange=()=>{draft[q.id][+s.dataset.si]=+s.value;renderCard();document.getElementById(s.id)?.focus();});
  const cb=document.getElementById("checkBtn");if(cb)cb.onclick=()=>check(q);
  const rb=document.getElementById("retryBtn");if(rb)rb.onclick=()=>{delete store.answers[q.id];delete draft[q.id];delete orderCache[q.id];save();renderCard();};
  document.getElementById("prevBtn").onclick=()=>go(-1);
  document.getElementById("nextBtn").onclick=()=>go(1);
}

function check(q){
  const resp=draft[q.id];
  const ready=q.type==="single"?resp!==null:q.type==="multi"?resp.length===q.pick:resp.every(x=>x>=0);
  if(!ready)return;
  const g=grade(q,resp);
  store.answers[q.id]={resp:JSON.parse(JSON.stringify(resp)),correct:g.correct};save();renderCard();
}
function go(d){
  const list=filtered();const i=list.findIndex(q=>q.id===store.current);const n=i+d;
  if(n<0||n>=list.length)return;store.current=list[n].id;save();renderCard();window.scrollTo({top:0});
}

// controls
document.querySelectorAll("#srcSeg button").forEach(b=>b.onclick=()=>{store.src=b.dataset.src;save();renderControls();renderCard();});
domainSel.onchange=()=>{store.domain=domainSel.value;save();renderCard();};
missedOnly.onchange=()=>{store.missedOnly=missedOnly.checked;save();renderCard();};
shuffle.onchange=()=>{store.shuffle=shuffle.checked;for(const k in orderCache)delete orderCache[k];save();renderCard();};
shuffleQ.onchange=()=>{store.shuffleQ=shuffleQ.checked;if(store.shuffleQ)store.qOrder=shuffledIds();save();renderControls();renderCard();};
reshuffleBtn.onclick=()=>{store.qOrder=shuffledIds();save();renderCard();};
grid.onclick=e=>{const b=e.target.closest("button[data-id]");if(!b)return;store.current=b.dataset.id;save();renderCard();if(window.innerWidth<=900){ctrl.open=false;card.scrollIntoView({behavior:"smooth"});}};
resetBtn.onclick=()=>{if(!confirm("Clear all answers and start over?"))return;store.answers={};for(const k in draft)delete draft[k];save();renderCard();};

resultsBtn.onclick=()=>{
  const pool=ALL.filter(q=>(store.src==="all"||q.src===store.src)&&(store.domain==="all"||String(q.domain)===store.domain));
  const ans=pool.filter(q=>store.answers[q.id]);const ok=ans.filter(q=>store.answers[q.id].correct);
  const row=(label,qs)=>{const a=qs.filter(q=>store.answers[q.id]);const o=a.filter(q=>store.answers[q.id].correct);const pct=a.length?Math.round(o.length/a.length*100):0;
    return '<div class="bar"><span>'+esc(label)+'</span><span class="n">'+o.length+' / '+a.length+'</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';};
  const doms=[...new Set(pool.map(q=>q.domain))].sort();
  const missed=pool.filter(q=>store.answers[q.id]&&!store.answers[q.id].correct);
  const pct=ans.length?Math.round(ok.length/ans.length*100):0;
  let h='<h2>Your results</h2><p style="margin:0;color:var(--muted)">'+ans.length+' of '+pool.length+' questions answered</p>';
  h+='<div class="scorepanel"><div class="ring" style="background:conic-gradient(var(--amber) '+(pct*3.6)+'deg, var(--line) 0deg)"><div class="ring-inner"><b>'+(ans.length?pct+"%":"–")+'</b><span>accuracy</span></div></div>';
  h+='<p>'+ok.length+' correct, '+(ans.length-ok.length)+' missed. AWS scales scores to 100–1,000 and requires 700 to pass, so aim for 80% or more here.</p></div>';
  h+='<h3 style="margin:22px 0 0;font-size:1rem">By domain</h3><div class="bars">'+doms.map(d=>row("Domain "+d+": "+DOMAINS[d],pool.filter(q=>q.domain===d))).join("")+'</div>';
  if(store.src==="all") h+='<h3 style="margin:10px 0 0;font-size:1rem">By source</h3><div class="bars">'+row("Tutorials Dojo",pool.filter(q=>q.src==="td"))+row("AI-generated",pool.filter(q=>q.src==="ai"))+'</div>';
  if(missed.length) h+='<h3 style="margin:10px 0 0;font-size:1rem">Missed questions</h3><div class="missed-list">'+missed.map(q=>'<button data-id="'+q.id+'">'+esc(q.stem.split("\n\n").slice(-1)[0].slice(0,110))+'…</button>').join("")+'</div>';
  h+='<div class="row">'+(missed.length?'<button class="btn" id="reviewMissed">Review missed only</button>':'')+'<button class="btn primary" id="closeRes">Close</button></div>';
  resultsBody.innerHTML=h;results.showModal();
  closeRes.onclick=()=>results.close();
  const rm=document.getElementById("reviewMissed");if(rm)rm.onclick=()=>{store.missedOnly=true;store.current=missed[0].id;save();renderControls();renderCard();results.close();};
  resultsBody.querySelectorAll(".missed-list button").forEach(b=>b.onclick=()=>{store.current=b.dataset.id;save();results.close();renderCard();});
};

document.addEventListener("keydown",e=>{
  if(results.open||e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="Enter"&&!e.target.closest("button")){const cb=document.getElementById("checkBtn");if(cb&&!cb.disabled)cb.click();}
  else{const i=LETTERS.indexOf(e.key.toUpperCase());if(i>=0&&i<8){const btns=card.querySelectorAll(".choice:not(:disabled)");if(btns[i])btns[i].click();}}
});

if(window.innerWidth<=900)ctrl.open=false;
renderControls();renderCard();
})();
</script>
</body>
</html>
